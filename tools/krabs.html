<!doctype html>

 figure{margin:0;background:#fff;border-radius:18px;padding:10px 6px 6px;

 figcaption{font-weight:800;font-size:1rem;margin-top:4px}
 figcaption small{display:block;font-weight:600;color:#55707a;font-size:.78rem}
 @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
