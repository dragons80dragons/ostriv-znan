<meta charset="utf-8">
<title>Острів Знань</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen game — map of four seas with eighteen islands → lesson
   card with big touch answers. Three levels on every island. */
:root{
  --sea:#d8eef3; --sea-deep:#2f7f99; --sand:#fff8e8; --ink:#173a45; --muted:#55707a;
  --coral:#e8684a; --leaf:#3f9a5c; --sun:#f2b632; --card:#ffffff; --line:#c3dde4;
  --display:"Comfortaa","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f2a33; --sea-deep:#6cc3dc; --sand:#16343e; --ink:#e7f4f7; --muted:#9fbcc5;
  --coral:#ff8a6d; --leaf:#6fd18f; --sun:#ffc94d; --card:#1b3f4a; --line:#2b5664; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f2a33; --sea-deep:#6cc3dc; --sand:#16343e; --ink:#e7f4f7; --muted:#9fbcc5;
  --coral:#ff8a6d; --leaf:#6fd18f; --sun:#ffc94d; --card:#1b3f4a; --line:#2b5664; color-scheme:dark}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hright{display:flex;gap:8px;align-items:center}
h1{font-family:var(--display);font-size:1.6rem;margin:0;text-wrap:balance}
.stars{font-weight:800;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
.stars b{color:var(--sun)}
.music{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
/* Tablet: no double-tap zoom, no text selection when a finger slips */
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
.lesson,.map,.cards,.album{user-select:none;-webkit-user-select:none}
/* The class tablets are 1920×1280: on a wide screen everything grows, so the
   targets stay comfortable for a finger instead of sitting in a narrow column */
@media (min-width:900px){
  body{font-size:20px}
  .wrap{max-width:1040px}
  .ans{min-height:112px}
  .island{padding:34px 24px}
}
button:focus-visible{outline:3px solid var(--sea-deep);outline-offset:3px}
img.pic{width:56px;height:56px;object-fit:contain;vertical-align:middle}
/* Усі картинки намальовані на білому й вирізані по контуру. У темній темі
   бліді з них — хмара, сніжинка, засніжене дерево — зливалися з тлом і
   завдання лишалось без картинки. Тому там, де картинку треба впізнати,
   вона сидить на світлій плитці. Виняток — урок тіней: там силует у
   темній темі білий, і на світлій плитці його б не стало видно. */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])
  .stage img.pic,:root:not([data-theme="light"]) .ans img.pic,
  :root:not([data-theme="light"]) .card img.pic,
  :root:not([data-theme="light"]) .album img.pic,
  :root:not([data-theme="light"]) .gift img.pic{
  background:#f3fafc;border-radius:14px;padding:3px}}
:root[data-theme="dark"] .stage img.pic,:root[data-theme="dark"] .ans img.pic,
:root[data-theme="dark"] .card img.pic,:root[data-theme="dark"] .album img.pic,
:root[data-theme="dark"] .gift img.pic{
  background:#f3fafc;border-radius:14px;padding:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])
  .stage .shadow img.pic{background:none;padding:0}}
:root[data-theme="dark"] .stage .shadow img.pic{background:none;padding:0}
.lead{margin:0;color:var(--muted);max-width:60ch}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.island{background:var(--sand);border:3px solid var(--line);border-radius:40% 45% 38% 50%/30% 35% 40% 38%;
  padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .15s}
.island:hover{transform:translateY(-4px) rotate(-1deg)}
.island .ico{font-size:3.2rem;line-height:1;position:relative}
.island .ico img.pic{width:96px;height:96px}
.island h2{font-family:var(--display);font-size:1.25rem;margin:4px 0 0}
.island p{margin:0;color:var(--muted);font-size:.95rem}
.island .got{font-size:1.3rem;letter-spacing:4px;color:var(--sun);min-height:1.6rem}
.island .got.nine{font-size:1rem;letter-spacing:1px}
.island .got i{color:var(--line);font-style:normal}
/* Прапорець на острові: видно здалеку, що там уже щось зібрано */
.island .flag{position:absolute;top:-10px;right:-14px;font-size:1.7rem;line-height:1}
/* Море — заголовок над своєю групою островів */
.seahead{display:flex;align-items:center;gap:10px;margin:10px 0 -4px;font-family:var(--display);
  font-size:1.15rem;font-weight:700}
.seahead .ico{font-size:1.6rem}
.seahead b{margin-left:auto;font-weight:800;color:var(--sun);font-variant-numeric:tabular-nums;font-size:.95rem}
/* Рівень: той самий острівець, тільки замкнений показано приглушено */
.island.lvl{border-radius:24px}
.island.shut{opacity:.55;filter:saturate(.4)}
.lesson{background:var(--card);border-radius:24px;border:2px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;align-items:center;gap:12px}
.back{background:none;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700}
.progress{flex:1;display:flex;gap:6px}
.progress span{flex:1;height:10px;border-radius:5px;background:var(--line)}
.progress span.done{background:var(--leaf)}
.progress span.now{background:var(--sun)}
.q{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.q h3{font-family:var(--display);font-size:1.35rem;margin:0;flex:1;min-width:0;text-wrap:balance}
.say{border:none;background:var(--sea);border-radius:50%;width:52px;height:52px;font-size:1.5rem;flex:none}
.stage{min-height:130px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
  font-size:2.6rem;background:var(--sea);border-radius:18px;padding:16px;text-align:center}
.stage .op{font-family:var(--display);font-size:2.2rem;color:var(--sea-deep);padding:0 6px}
.stage .slot{width:64px;height:64px;border:3px dashed var(--sea-deep);border-radius:14px;display:inline-flex;align-items:center;justify-content:center}
.stage .big{font-size:5rem}
.stage .big img.pic{width:140px;height:140px}
.stage .faded{opacity:.25}
.stage .word{font-family:var(--display);font-size:1.6rem;width:100%}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.answers.two{grid-template-columns:repeat(2,1fr)}
/* Чотири-п'ять відповідей: хай переносяться, але кнопка не вужча за палець */
.answers.many{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ans{position:relative;background:var(--sand);border:3px solid var(--line);border-radius:18px;min-height:88px;font-family:var(--display);font-size:2.4rem;font-weight:700;transition:transform .1s}
.ans:active{transform:scale(.96)}
.ans.txt{font-size:1.15rem;line-height:1.3;padding:10px 10px 26px}
/* Кнопку зі словом можна послухати: дитина 1 класу ще не читає */
.ans .sp{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:1rem;
  opacity:.65;font-weight:400}
.ans.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.ans.no{border-color:var(--coral);animation:shake .35s}
.ans.hint{border-color:var(--leaf);border-style:dashed}
.ans:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:1.6rem;margin:0;font-weight:800;text-align:center}
.msg.good{color:var(--leaf)} .msg.bad{color:var(--coral)}
.next{align-self:center;background:var(--sea-deep);color:var(--card);border:none;border-radius:16px;padding:14px 32px;font-weight:800;font-size:1.1rem}
.finish{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.finish .big{font-size:4rem;letter-spacing:8px;color:var(--sun)}
.finish h3{font-family:var(--display);font-size:1.6rem;margin:0}
.note{color:var(--muted);font-size:.85rem;margin:0}
/* Наліпка, яку щойно дали: з'являється з підскоком, щоб її неможливо було не побачити */
.gift{background:var(--sand);border:3px dashed var(--sun);border-radius:20px;padding:14px 20px;
  display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .45s}
.gift img.pic{width:120px;height:120px}
.gift span{font-weight:800;color:var(--sea-deep)}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1)}}
/* Альбом наліпок: зібрані — кольорові, решта — сірі силуети */
.album{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px}
.album div{background:var(--sand);border:2px solid var(--line);border-radius:16px;padding:8px;
  text-align:center;position:relative}
.album img.pic{width:72px;height:72px}
.album div.off{opacity:.3;filter:grayscale(1)}
.album b{position:absolute;bottom:2px;right:6px;font-size:.8rem;color:var(--sea-deep)}
/* Order lesson: a row the child counts along; it may wrap on a phone */
.stage .rowpics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.stage .rowpics img.pic{width:64px;height:64px}
/* Place lesson: the same two pictures, stacked or side by side */
.stage .rel{display:flex;align-items:center;justify-content:center;gap:10px}
.stage .rel.above{flex-direction:column}
.stage .rel.under{flex-direction:column-reverse}
.stage .rel.left{flex-direction:row}
.stage .rel.right{flex-direction:row-reverse}
.stage .rel .obj img.pic{width:84px;height:84px}
.stage .rel .ref img.pic{width:104px;height:104px}
/* Shadow lesson: the picture painted flat black — and white in the dark
   theme, where black on navy would be invisible */
.stage .shadow{filter:brightness(0) opacity(.85)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage .shadow{
  filter:brightness(0) invert(1) opacity(.9)}}
:root[data-theme="dark"] .stage .shadow{filter:brightness(0) invert(1) opacity(.9)}
/* Comparing two heaps: two boxes with an "і" between them */
.stage .side{display:inline-flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;
  max-width:42%;padding:8px;border-radius:14px;background:var(--card)}
.stage .vs{font-family:var(--display);color:var(--muted);font-size:1.2rem;padding:0 8px}
/* Clock and hryvnia coins are drawn, not photographed: the hands must point
   somewhere different every time and a coin must stay readable at 70px */
.clock{width:min(190px,45vw);height:auto;color:var(--sea-deep)}
.coin{display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;
  margin:4px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:1.5rem;
  color:#4a3b14;background:radial-gradient(circle at 34% 30%,#ffe9a8,#e6b949 70%);
  border:3px solid #c99c2e;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15)}
.coin.c5,.coin.c10{background:radial-gradient(circle at 34% 30%,#fff3cf,#d9ab3e 70%)}
.coin.c10{width:80px;height:80px}
/* Who is playing: same island cards, plus a small × to remove a profile */
.kidwrap{position:relative}
.kidwrap .island{width:100%}
.kidwrap .x{position:absolute;top:8px;right:12px;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--line);background:var(--card);font-size:1.1rem;line-height:1;color:var(--muted)}
.nm{font:inherit;font-size:1.3rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);
  background:var(--sand);color:var(--ink);width:100%;max-width:320px;align-self:center}
.avas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ava{font-size:1.8rem;background:var(--sand);border:3px solid var(--line);border-radius:14px;
  width:60px;height:60px;line-height:1}
.ava.on{border-color:var(--leaf);background:var(--card)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* Memory lesson: cards turn face up on tap, matched pairs stay open */
.cards{display:grid;gap:10px}
.card{aspect-ratio:1;background:var(--sand);border:3px solid var(--line);border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;transition:transform .12s,background .2s}
.card:active{transform:scale(.96)}
.card .face{opacity:0;transition:opacity .15s}
.card.open .face,.card.done .face{opacity:1}
.card.open{background:var(--card);border-color:var(--sea-deep)}
.card.done{background:var(--leaf);border-color:var(--leaf)}
.card img.pic{width:64px;height:64px}
/* Tracing lesson: finger draws on the top canvas, the letter sits under it */
.trace{display:flex;flex-direction:column;align-items:center;gap:12px}
.pad{position:relative;width:min(320px,80vw);aspect-ratio:1}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
.pad canvas.ink{touch-action:none;cursor:crosshair}
.pad canvas.glyph{background:var(--sea);border:2px solid var(--line)}
.trace .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* Краб-провідник: він вітає, підказує й радіє замість безликих фраз.
   Стоїть унизу сторінки, щоб ніколи не перекривав кнопки відповідей. */
/* Помічник плаває поверх гри, як колись в офісних програмах: його можна
   перетягнути пальцем куди завгодно, сховати й покликати назад. Місце й
   стан зберігаються в профілі дитини — на планшеті їх кілька, і кожна
   посадить краба туди, де їй зручно. */
.crab{position:fixed;z-index:50;display:flex;flex-direction:column;align-items:flex-start;
  gap:6px;width:min(300px,72vw);background:none;border:none;padding:0;text-align:left;
  touch-action:none;transition:left .25s ease,top .25s ease}
.crab.drag{transition:none;opacity:.9}
.crab.right{align-items:flex-end}
/* Краб став кнопкою заради дотику — тло й рамку, які браузер дає кнопці
   типово, треба зняти, інакше він сидить на сірому прямокутнику */
.crab .cr{background:none;border:none;padding:0;cursor:grab}
.crab.drag .cr{cursor:grabbing}
/* Краб — одна картинка, яка рухається кодом. Пози окремими картинками не
   вийшли (див. README): через txt2img щоразу інший герой, через img2img від
   взірця герой один, але поза не змінюється. Тут натомість анімація: кожен
   настрій — свій цикл із п'яти ключів, а предмет у клешні (прапорець,
   зірка, книжка) накладається поверх окремою картинкою. */
.crab .cr{font-size:3rem;line-height:1;flex:none;display:inline-block;
  position:relative;width:108px;height:108px}
.crab .cr .rig{display:block;position:absolute;inset:0}
.crab .cr .body img.pic{width:104px;height:104px;display:block}
/* ---------- Краб у векторі: кожна частина рухається окремо ---------- */
.krab{width:124px;height:102px;display:block;overflow:visible}
.krab .shell{fill:url(#krshell);stroke:#43150f;stroke-width:4.5;stroke-linejoin:round}
.krab .gloss{fill:none;stroke:rgba(255,255,255,.45);stroke-width:7;stroke-linecap:round}
.krab .stalk{fill:none;stroke:#43150f;stroke-width:9;stroke-linecap:round}
.krab .white{fill:#fff;stroke:#43150f;stroke-width:3.5}
.krab .pupil{fill:#2b1a16}
.krab .spark{fill:#fff;opacity:.9}
.krab .brow{fill:none;stroke:#43150f;stroke-width:4.5;stroke-linecap:round}
.krab .mouth{fill:#5e1a12}
.krab .chin{fill:none;stroke:rgba(67,21,15,.5);stroke-width:3;stroke-linecap:round}
/* Нога: темний контур дає товста лінія знизу, колір — тонша зверху */
.krab .leg{transform-box:fill-box}
.krab .leg path{fill:none;stroke-linecap:round}
.krab .leg-up{stroke:#43150f;stroke-width:13}
.krab .leg-dn{stroke:#43150f;stroke-width:9}
.krab .leg-up-i{stroke:#e0332a;stroke-width:7}
.krab .leg-dn-i{stroke:#e0332a;stroke-width:4}
.krab .arm{fill:none;stroke:#43150f;stroke-width:14;stroke-linecap:round}
.krab .palm,.krab .fing{fill:url(#krclaw);stroke:#43150f;stroke-width:4;stroke-linejoin:round}
.krab .shadow{fill:rgba(0,0,0,.18)}
/* Повіка стоїть піднята й опускається лише на час кліпання */
.krab .lid{fill:#e0332a;stroke:#2b1a16;stroke-width:4;transform-box:fill-box;
  transform-origin:50% 100%;transform:scaleY(0)}
/* Клешня обертається у плечі, а не їздить по екрану */
.krab .claw{transform-box:fill-box;transform-origin:0 100%}
.krab .body,.krab .face{transform-box:fill-box;transform-origin:50% 60%}
.krab .brow,.krab .mouth{transform-box:fill-box;transform-origin:50% 50%}
/* Нога обертається там, де росте з панцира: ліві — правим краєм своєї
   рамки, праві — лівим. Інакше вона не крокує, а їздить убік. */
.krab .leg1,.krab .leg2,.krab .leg3,.krab .leg4{transform-origin:100% 0}
.krab .leg5,.krab .leg6,.krab .leg7,.krab .leg8{transform-origin:0 0}

/* ---------- Рух частин: саме він робить краба живим ----------
   Раніше це намагалися зробити готовими кадрами з AnimateDiff — і кадри
   виходили майже однакові, ворушився лише контур. Тут кожна частина має
   свій суглоб, тож рух задається прямо й видно його одразу. */
.krab .lid{animation:kr-blink 5.4s linear infinite}
@keyframes kr-blink{0%,92%{transform:scaleY(0)}95%{transform:scaleY(1)}
  98%,100%{transform:scaleY(0)}}

.crab[data-mood="hi"] .side-l .claw{animation:kr-wave 1.4s ease-in-out infinite}
.crab[data-mood="hi"] .side-r .claw{animation:kr-wave2 1.4s ease-in-out infinite}
@keyframes kr-wave{0%{transform:rotate(0)}25%{transform:rotate(-30deg)}
  50%{transform:rotate(-8deg)}75%{transform:rotate(-24deg)}100%{transform:rotate(0)}}
@keyframes kr-wave2{0%{transform:rotate(-10deg)}25%{transform:rotate(4deg)}
  50%{transform:rotate(-16deg)}75%{transform:rotate(2deg)}100%{transform:rotate(-10deg)}}

.crab[data-mood="walk"] .leg1,.crab[data-mood="walk"] .leg3,
.crab[data-mood="walk"] .leg6,.crab[data-mood="walk"] .leg8,
.crab[data-mood="swim"] .leg1,.crab[data-mood="swim"] .leg3,
.crab[data-mood="swim"] .leg6,.crab[data-mood="swim"] .leg8{
  animation:kr-step .5s ease-in-out infinite}
.crab[data-mood="walk"] .leg2,.crab[data-mood="walk"] .leg4,
.crab[data-mood="walk"] .leg5,.crab[data-mood="walk"] .leg7,
.crab[data-mood="swim"] .leg2,.crab[data-mood="swim"] .leg4,
.crab[data-mood="swim"] .leg5,.crab[data-mood="swim"] .leg7{
  animation:kr-step .5s ease-in-out infinite reverse}
@keyframes kr-step{0%{transform:rotate(-9deg)}25%{transform:rotate(3deg)}
  50%{transform:rotate(10deg)}75%{transform:rotate(2deg)}100%{transform:rotate(-9deg)}}
.crab[data-mood="swim"] .leg{animation-duration:.34s}

.crab[data-mood="joy"] .claw{animation:kr-up .62s ease-in-out infinite}
.crab[data-mood="joy"] .mouth{transform:scaleY(1.5)}
@keyframes kr-up{0%{transform:rotate(-4deg)}25%{transform:rotate(-44deg)}
  50%{transform:rotate(-22deg)}75%{transform:rotate(-40deg)}100%{transform:rotate(-4deg)}}

.crab[data-mood="clap"] .claw{animation:kr-clap .34s ease-in-out infinite}
@keyframes kr-clap{0%{transform:rotate(-32deg)}25%{transform:rotate(16deg)}
  50%{transform:rotate(-28deg)}75%{transform:rotate(14deg)}100%{transform:rotate(-32deg)}}

<script>
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const A = 'assets/';
// The one-file build (tools/build_single.py) puts every picture and clip into
// window.EMBED as data: URIs. Nothing else changes: the game still asks for
// 'img/w_kit.png', it just gets it from memory instead of from the folder.
const asset = p => (window.EMBED && window.EMBED[p]) || A + p;

// ---------- Profiles: every child on the tablet keeps their own stars and log.
const AVATARS = ['🦊','🐱','🐻','🐸','🐥','🐼','🦉','🐝','🐬','🦄','🐢','🐰'];
// v4 зберігає зірки за рівнями (stars[урок][рівень]), наліпки (st) і день
// останньої мандрівки (day). Усе старе переноситься, щоб ніхто не втратив
// зароблене: v1 — плоске {урок: зірки}, v3 — вже за рівнями, але без наліпок.
let DB = {v:4, cur:null, kids:{}};
function fix(kids){
  for (const k of Object.values(kids || {})){
    for (const [les, val] of Object.entries(k.stars || {}))
      if (typeof val === 'number') k.stars[les] = {1: val};
    if (!k.st) k.st = {};
    if (!('day' in k)) k.day = '';
    if (typeof k.trips !== 'number') k.trips = 0;
  }
  return kids || {};
}
try {
  const raw = JSON.parse(localStorage.getItem('ostriv') || '{}');
  if (raw && (raw.v === 2 || raw.v === 3 || raw.v === 4)){ DB = raw; DB.v = 4; DB.kids = fix(DB.kids); }
  else if (raw && Object.keys(raw).length){
    const id = 'k'+Date.now();
    DB.kids[id] = {name:'Гість', ava:'🦊', stars:{}, st:{}, day:'', trips:0, log:[]}; DB.cur = id;
    for (const [les, val] of Object.entries(raw))
      if (typeof val === 'number') DB.kids[id].stars[les] = {1: val};
  }
} catch(e){}
const save = () => { try { localStorage.setItem('ostriv', JSON.stringify(DB)); } catch(e){} };
const kid = () => DB.kids[DB.cur] || null;
const stars = () => (kid() ? kid().stars : {});
// Рівнів три. Наступний відкривається, коли на попередньому є хоча б дві
// зірки: не «пройшов абияк», але й не вимагає ідеалу.
const LEVELS = [
  {n:1, name:'Легко',    ico:'🌱', vo:'lv_1'},
  {n:2, name:'Середньо', ico:'🌿', vo:'lv_2'},
  {n:3, name:'Складно',  ico:'🌳', vo:'lv_3'},
];
const starsAt = (id, lvl) => ((stars()[id] || {})[lvl] || 0);
const lessonStars = id => LEVELS.reduce((a, L) => a + starsAt(id, L.n), 0);
const levelOpen = (id, lvl) => lvl === 1 || starsAt(id, lvl - 1) >= 2;
const today = () => { const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

// ---------- Teacher reports over the class Wi-Fi, no internet involved.
// Sent only when the game was opened from the teacher's PC (http://…): from a
// file:// copy there is nowhere to send, and nothing ever goes anywhere else.
// If the PC is off, results wait in the queue and go with the next lesson.
let REPORT = location.protocol.startsWith('http') ? 'api/report' : null;
let queue = [];
try { queue = JSON.parse(localStorage.getItem('ostriv_q') || '[]'); } catch(e){}
const saveQ = () => { try { localStorage.setItem('ostriv_q', JSON.stringify(queue.slice(-100))); } catch(e){} };
function flush(){
  if (!REPORT || !queue.length) return;
  const batch = queue.slice(0, 50);
  fetch(REPORT, {method:'POST', headers:{'Content-Type':'application/json'},
                 body: JSON.stringify(batch)})
    .then(r => {
      if (r.ok){ queue = queue.slice(batch.length); saveQ(); }
      else if (r.status === 404 || r.status === 405){ REPORT = null; queue = []; saveQ(); }
    })
    .catch(()=>{});
}
function report(rec){ if (!REPORT) return; queue.push(rec); saveQ(); flush(); }

// ---------- Pictures: assets/img/<id>.png, emoji if missing
function pic(id, emo){ return `<img class="pic" src="${asset('img/'+id+'.png')}" alt="" data-e="${emo}" onerror="this.replaceWith(document.createTextNode(this.dataset.e))">`; }

// ---------- Voice: assets/voice/<id>.wav played in sequence; system TTS if missing
let ukVoice = null, enVoice = null, playToken = 0, cur = null;
const noFile = new Set();   // clips we already know are missing — spoken instead
function loadVoice(){ try{ const v = speechSynthesis.getVoices();
  const by = p => v.find(x => x.lang && x.lang.toLowerCase().startsWith(p)) || null;
  ukVoice = by('uk'); enVoice = by('en'); }catch(e){} }
try { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; } catch(e){}
// Speak one fragment and carry on with the rest of the chain. A missing clip
// must not silence the recorded ones: it degrades on its own, not for all.
function tts(text, done, token, en){
  let went = false;
  const go = () => { if(went) return; went = true; if(token===playToken && done) done(); };
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = en ? 'en-US' : 'uk-UA';
    const v = en ? enVoice : ukVoice; if(v) u.voice = v;
    u.rate = en ? .8 : .9;
    u.onend = go; u.onerror = go;
    speechSynthesis.speak(u);
    setTimeout(go, 600 + text.length*80);   // no uk voice installed → onend never comes
  }catch(e){ go(); }
}
function say(parts){ // parts: [[id, text], ...]
  const token = ++playToken;
  try{ if(cur){cur.pause(); cur=null;} speechSynthesis.cancel(); }catch(e){}
  let i = 0;
  const next = () => {
    if(token!==playToken || i>=parts.length) return;
    const p = parts[i++];
    if(!p || !p[0]){ next(); return; }
    if(p[0].startsWith('en:')){ tts(p[1], next, token, true); return; }  // англійське слово
    if(noFile.has(p[0])){ tts(p[1], next, token); return; }
    const a = new Audio(asset('voice/'+p[0]+'.wav')); cur = a;
    a.onended = next;
    a.onerror = () => { if(token!==playToken) return; noFile.add(p[0]); tts(p[1], next, token); };
    a.play().catch(()=>{});
  };
  next();
}

// ---------- Короткі звукові ефекти. Не файли, а два-три тони з WebAudio:
// так вони нічого не важать, працюють офлайн і не чекають завантаження.
let AC = null;
function beep(seq, vol){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch(e){ return; }
  let t = AC.currentTime + .01;
  for (const [f, d] of seq){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || .13, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d + .02);
    t += d * .85;
  }
}
const sfxOk   = () => beep([[880,.09],[1320,.17]]);
const sfxNo   = () => beep([[330,.13],[240,.2]], .09);
const sfxWin  = () => beep([[660,.1],[880,.1],[1100,.1],[1320,.28]]);
const sfxGift = () => beep([[1040,.07],[1560,.07],[2080,.2]], .1);

// ---------- Краб Клац: вітає, підказує й радіє. Говорить замість гри —
// дитині потрібен хтось, а не безликий рядок унизу екрана.
// Третім елементом у фразі — настрій. Настрій це не окрема картинка, а
// свій цикл руху з п'яти ключів (CSS) плюс, за потреби, предмет у клешні:
// p — картинка предмета, z — «z-z-z» уві сні, b — бульбашки під водою.
// Пози окремими картинками не вийшли, причина записана в README.
const MOODS = {
  hi:    {},
  walk:  {},
  joy:   {},
  clap:  {},
  oops:  {},
  point: {},
  think: {},
  sleep: {z: true},
  swim:  {b: true},
  flag:  {p: ['gx_flag', '🚩']},
  star:  {p: ['o_star', '⭐']},
  read:  {p: ['gx_book', '📖']},
};
const CRAB = {
  hi:    ['g_hi',     'Привіт! Я краб Клац. Обери острів, і попливли.', 'hi'],
  lvl:   ['g_lvl',    'Вибери рівень. Починай із легкого.', 'think'],
  go:    ['g_go',     'Слухай уважно. Я поруч.', 'point'],
  good:  ['g_good',   'Ось так! Ти молодець.', 'joy'],
  oops:  ['g_oops',   'Ой! Не страшно, спробуй ще.', 'oops'],
  hint:  ['g_hint',   'Дивись, ось правильна відповідь.', 'point'],
  fin3:  ['g_fin3',   'Три зірки! Тримай наліпку в альбом.', 'joy'],
  fin:   ['g_fin',    'Урок пройдено. Ходімо далі.', 'joy'],

// дає шістнадцять майже однакових кадрів — ворушаться пікселі по контуру,
// і це читається як несправність, а не як рух. У векторі кожна частина
// окрема, тож клешня справді обертається у плечі, повіка справді
// опускається, а нога справді крокує. Плюс нуль байтів і будь-який розмір.
function crabSVG(){
  // Нога з двох колін і з потовщенням: верхня частина товста, нижня
  // тонша й гостра. Одним штрихом однакової товщини вона виглядає як
  // намальована паличка, а не як лапа.
  const leg = (n, x, y, k, a, b) => {
    const up = `M${x} ${y} q${k*a} ${b*0.5} ${k*a*1.5} ${b}`;
    const dn = `M${x+k*a*1.5} ${y+b} q${k*5} ${b*0.5} ${k*3} ${b*0.9}`;
    // Кожна частина малюється двічі: товстою темною лінією — контур,
    // тоншою червоною поверх — сам колір. Одна лінія так не вміє.
    return `<g class="leg leg${n}">
      <path class="leg-up" d="${up}"/><path class="leg-dn" d="${dn}"/>
      <path class="leg-up-i" d="${up}"/><path class="leg-dn-i" d="${dn}"/>
    </g>`;
  };
  // Клешня: плече в нулі групи, далі рука вгору-вбік і дві стулки.
  // Обертається вона саме навколо нуля, тому махання виглядає як рух
  // у суглобі, а не як поїздка картинки по екрану.
  // Клешня: долоня плюс два пальці з проміжком між ними. Саме проміжок
  // і читається як кліщі — суцільна червона пляма виглядає як варення.
  const claw = `
    <g class="claw">
      <path class="arm" d="M0 0 q-12 -8 -20 -16"/>
      <g class="pin">
        <path class="palm" d="M-20 -16 q-18 -4 -24 -18 q-3 -13 9 -16 q16 -3 23 10 q7 13 -8 24 z"/>
        <path class="fing" d="M-45 -36 q-17 -9 -25 -2 q9 9 23 9 z"/>
        <path class="fing" d="M-39 -19 q-17 7 -18 16 q13 2 23 -9 z"/>
      </g>
    </g>`;
  const eye = (side, x) => `
    <g class="eye eye-${side}">
      <path class="stalk" d="M${x} 86 L${x - 1} 62"/>
      <circle class="white" cx="${x - 1}" cy="56" r="12"/>
      <circle class="pupil" cx="${x + 1}" cy="58" r="5.5"/>
      <circle class="spark" cx="${x - 4}" cy="52" r="3"/>
      <path class="lid" d="M${x - 13} 56 a12 12 0 0 1 24 0 z"/>
    </g>`;
  return `<svg class="krab" viewBox="0 0 210 172" role="img" aria-label="краб Клац">
    <defs>
      <linearGradient id="krshell" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff6a52"/><stop offset=".55" stop-color="#e0332a"/>
        <stop offset="1" stop-color="#a81d18"/>
      </linearGradient>
      <linearGradient id="krclaw" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff6a52"/><stop offset="1" stop-color="#c3241d"/>
      </linearGradient>
    </defs>
    <ellipse class="shadow" cx="105" cy="158" rx="50" ry="7"/>
    <g class="legs">
      ${leg(1, 70, 106, -1, 17, 6)}${leg(2, 74, 117, -1, 16, 9)}
      ${leg(3, 83, 126, -1, 13, 11)}${leg(4, 94, 132, -1, 9, 12)}
      ${leg(5, 140, 106, 1, 17, 6)}${leg(6, 136, 117, 1, 16, 9)}
      ${leg(7, 127, 126, 1, 13, 11)}${leg(8, 116, 132, 1, 9, 12)}
    </g>
    <g class="arms">
      <g class="side-l" transform="translate(64,98) scale(1.18)">${claw}</g>
      <g class="side-r" transform="translate(146,98) scale(-1.18,1.18)">${claw}</g>
    </g>
    <g class="body">
      <!-- Панцир: не рівний овал, а ширший спереду, з двома шпичками
           збоку — так силует одразу читається як краб -->
      <path class="shell" d="M105 60 q34 0 48 16 q10 11 8 22 l10 3 l-11 5
        q-6 16 -24 22 q-14 5 -31 5 q-17 0 -31 -5 q-18 -6 -24 -22 l-11 -5 l10 -3
        q-2 -11 8 -22 q14 -16 48 -16 z"/>
      <path class="gloss" d="M80 82 q10 -13 28 -14"/>
      <g class="face">
        ${eye('l', 90)}${eye('r', 122)}
        <path class="brow brow-l" d="M76 40 q11 -8 21 -2"/>
        <path class="brow brow-r" d="M113 38 q11 -6 21 3"/>

// Краб показує клешнею на те, про що говорить: рамка блимає, а сам він
// розвертається в той бік. Для шестирічки це зрозуміліше за будь-який текст.
function lookAt(sel){
  const el = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!el) return;
  // Світитися має рівно одне: дві рамки одночасно — це вже не підказка.
  document.querySelectorAll('.look').forEach(x => x.classList.remove('look'));
  void el.offsetWidth; el.classList.add('look');
  setTimeout(() => el.classList.remove('look'), 3200);
  const r = el.getBoundingClientRect(), c = $('#crab').getBoundingClientRect();
  $('#crab').classList.toggle('flip', r.left + r.width/2 < c.left + 60);
}
// Де сидить помічник і чи його покликано — у профілі дитини, не в браузері:
// на планшеті профілів кілька, і кожна садить краба туди, де їй зручно.
// Координати зберігаються частками екрана, щоб пережити поворот планшета.
const HELP_DEF = {x: .03, y: .68, off: false};
function helpCfg(){
  const k = kid();
  if (!k) return HELP_DEF;
  if (!k.help) k.help = Object.assign({}, HELP_DEF);
  return k.help;
}
function placeCrab(){
  const el = $('#crab'), h = helpCfg();
  const w = el.offsetWidth || 240, ht = el.offsetHeight || 150;
  const x = Math.min(Math.max(8, innerWidth - w - 8), Math.max(8, h.x * innerWidth));
  const y = Math.min(Math.max(8, innerHeight - ht - 8), Math.max(8, h.y * innerHeight));
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  // Біля правого краю краб стає праворуч у своїй коробці, а хвостик хмарки
  // переїжджає на той самий бік — інакше вона показує в порожнечу.
  el.classList.toggle('right', x + w / 2 > innerWidth / 2);
}

let dragSt = null;
$('#crab').addEventListener('pointerdown', e => {
  const r = $('#crab').getBoundingClientRect();
  dragSt = {dx: e.clientX - r.left, dy: e.clientY - r.top,
            x0: e.clientX, y0: e.clientY, moved: false};
  try { $('#crab').setPointerCapture(e.pointerId); } catch(err){}
});
$('#crab').addEventListener('pointermove', e => {
  if (!dragSt) return;
  if (!dragSt.moved && Math.hypot(e.clientX - dragSt.x0, e.clientY - dragSt.y0) < 6) return;
  dragSt.moved = true;
  const el = $('#crab');
  el.classList.add('drag');
  el.style.left = (e.clientX - dragSt.dx) + 'px';
  el.style.top = (e.clientY - dragSt.dy) + 'px';
});
function dragEnd(e){
  if (!dragSt) return;
  const el = $('#crab'), was = dragSt;
  dragSt = null;
  el.classList.remove('drag');
  if (was.moved){
    const r = el.getBoundingClientRect(), h = helpCfg();
    h.x = r.left / innerWidth; h.y = r.top / innerHeight; save();
    placeCrab();                      // підтягнути, якщо вилізло за край
  } else if (e.target.closest('.cr')){
    if (el.dataset.back){ delete el.dataset.back; guide(crabSaid, true); }
    else if (crabSaid){ bubble(crabSaid[1]); say([crabSaid]); }
  }
}

function numOpts(k, lo, hi, m){
  m = m || 3;
  const s = new Set([k]), room = hi - lo + 1;
  let spin = 0;
  while (s.size < Math.min(m, room) && spin++ < 300){
    const d = k + (rnd(2) ? 1 : -1) * (1 + rnd(m));
    if (d >= lo && d <= hi) s.add(d);
  }
  return shuffle([...s]).map(v => ({v:String(v), html:String(v)}));
}

function optsFrom(pool, right, m, mk){
  const others = pick(pool.filter(x => x !== right), m - 1);
  return shuffle([right].concat(others)).map(mk);
}

function mathTasks(v){
  const t = [];
  const cnt = v===1 ? 3 : v===2 ? 2 : 0;
  for (let i=0;i<cnt;i++){
    const c = v===1 ? 2+rnd(4) : 3+rnd(7), f = FRUIT[rnd(FRUIT.length)];
    t.push({prompt:'Скільки тут предметів?', speak:[P.count], stage: pic(f[0],f[1]).repeat(c),
      answer:String(c), options:numOpts(c, 1, 10, v===3?4:3)});
  }
  while (t.length < 5){
    const plus = v===1 ? true : v===2 ? (t.length<4 || Math.random()<.5) : Math.random()<.45;
    const top = v===1 ? 3 : 5, cap = v===1 ? 5 : 10;
    let a = 1+rnd(top), b = 1+rnd(top);
    if (!plus && b > a) [a,b] = [b,a];
    if (plus && a+b > cap) a = Math.max(1, cap - b);
    const r = plus ? a+b : a-b, f = FRUIT[rnd(FRUIT.length)], p = pic(f[0],f[1]);
    t.push({prompt: plus?'Скільки буде разом?':'Скільки залишилось?',
      speak: plus? [n(a),P.plus,n(b),P.together] : [P.was,n(a),P.took,n(b),P.left],
      stage: plus
        ? `<span>${p.repeat(a)}</span><span class="op">+</span><span>${p.repeat(b)}</span><span class="word">${a} + ${b} = ?</span>`
        : `<span>${p.repeat(a-b)}<span class="faded">${p.repeat(b)}</span></span><span class="word">${a} − ${b} = ?</span>`,
      answer:String(r), options:numOpts(r, 0, 10, v===3?4:3)});
  }
  return shuffle(t);
}

function readTasks(v){
  const used = new Set(), t = [], m = v===1 ? 3 : 4;
  for (const w of shuffle(WORDS)){
    if (used.has(w[3])) continue;
    used.add(w[3]);
    const opts = new Set([w[3]]);
    while (opts.size < m) opts.add(LETTERS[rnd(LETTERS.length)]);
    // На складному рівні слово не підписане: лишається тільки картинка й голос.
    t.push({prompt:'З якої букви починається слово?', speak:[[w[0],w[2]],P.letter,[w[0],w[2]]],
      stage:`<span class="big">${pic(w[0],w[1])}</span>`
            + (v===3 ? '' : `<span class="word">${'_'+w[2].slice(1)}</span>`),
      answer:w[3], options:shuffle([...opts]).map(x=>({v:x, html:x}))});
    if (t.length===5) break;
  }
  return t;
}

function logicTasks(v){
  const kinds = v===1 ? ['AB','AB','AB','ABA','AAB']
              : v===2 ? ['AB','ABC','AAB','ABB','ABC']
                      : ['ABC','AAB','ABB','ABCB','AABB'];
  const t = [], m = v===3 ? 4 : 3;
  for (const k of shuffle(kinds)){
    const sym = pick(SHAPES, 3), map = {A:sym[0],B:sym[1],C:sym[2]};
    const len = k.length===2 ? 5 : k.length===3 ? 6+rnd(2) : 7;
    const seq = Array.from({length:len+1},(_,i)=>map[k[i%k.length]]);
    const ans = seq.pop();
    const opts = new Set([ans]);
    for (const s of shuffle(SHAPES)) if (opts.size < m) opts.add(s);
    t.push({prompt:'Що буде далі?', speak:[P.pattern],
      stage: seq.map(s=>pic(s[0],s[1])).join('')+`<span class="slot">?</span>`,
      answer:ans[0], options:shuffle([...opts]).map(s=>({v:s[0],html:pic(s[0],s[1])}))});
  }
  return t;
}

// ---------- Tracing with a finger. Vowels first, then consonants, then both.
// Each prompt is one recorded phrase, not a letter clip glued to a phrase:
// a letter on its own comes out of the synthesiser as noise, and the name of
// a consonant («ем», «ен») is what a first-grader is taught anyway.
const TRACE_V = [['А','t_a','а'],['О','t_o','о'],['У','t_u','у'],['И','t_y','и']];
const TRACE_C = [['М','t_m','ем'],['Н','t_en','ен'],['Л','t_el','ел'],['С','t_es','ес'],['К','t_ka','ка']];
function traceTasks(v){
  const t = [];
  const lets = v===1 ? pick(TRACE_V, 3) : v===2 ? pick(TRACE_C, 3)
                                                : pick(TRACE_V.concat(TRACE_C), 3);
  for (const [ch,id,name] of lets)

// ---------- Time: a clock drawn right here, and the parts of the day.
// The clock is SVG rather than a picture: the hands have to point somewhere
// different every time, and a drawn dial stays sharp at any size.
function clockFace(h){
  const a = (h % 12) * 30 - 90, r = 24;
  const x = 50 + r*Math.cos(a*Math.PI/180), y = 50 + r*Math.sin(a*Math.PI/180);
  // Усі дванадцять цифр, як на справжньому навчальному годиннику: дитина
  // шукає число очима, а не рахує риски.
  const marks = Array.from({length:12}, (_,i) => {
    const hour = i === 0 ? 12 : i, t = (i*30 - 90) * Math.PI/180;
    const tx = 50 + 35*Math.cos(t), ty = 50 + 35*Math.sin(t) + 4;
    const x1 = 50 + 44*Math.cos(t), y1 = 50 + 44*Math.sin(t);
    const x2 = 50 + 41*Math.cos(t), y2 = 50 + 41*Math.sin(t);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round"/>
      <text x="${tx}" y="${ty}" text-anchor="middle" font-size="12"
        font-weight="700" fill="var(--ink)">${hour}</text>`;
  }).join('');
  return `<svg class="clock" viewBox="0 0 100 100" role="img" aria-label="годинник">
    <circle cx="50" cy="50" r="47" fill="var(--card)" stroke="currentColor" stroke-width="3"/>
    ${marks}
    <line x1="50" y1="50" x2="${x}" y2="${y}" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="50" y2="14" stroke="var(--sea-deep)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3.5" fill="currentColor"/></svg>`;
}

  ['вечір', 'Сонце сідає, надворі темніє', 'w_sontse', 'a_evening'],

// ---------- Money: hryvnia coins, drawn with CSS. Sums stay within ten on the
// first two levels, so it is the counting lesson again, only in a shape the
// child meets in a shop.
const COINS = [1, 2, 5, 10];
const coin = x => `<span class="coin c${x}">${x}</span>`;
function moneyTasks(v){
  const t = [];
  const lo = v===1 ? 2 : 3, hi = v===1 ? 6 : v===2 ? 10 : 20;
  for (let i=0; i<5; i++){
    let pile = [], sum = 0, spin = 0;
    while ((sum < lo || sum > hi) && spin++ < 400){
      pile = []; sum = 0;
      const k = 2 + rnd(v===1 ? 2 : 3);
      for (let j=0; j<k; j++){
        const c = COINS[rnd(v===1 ? 2 : v===2 ? 3 : COINS.length)];
        pile.push(c); sum += c;
      }
    }
    t.push({prompt:'Скільки тут гривень?', speak:[P.money],
      stage: pile.map(coin).join(''), answer:String(sum),
      options: numOpts(sum, 1, hi + 2, v===3 ? 4 : 3)});

  return t;
}

// ---------- Syllables: hear one, point at it. The step between knowing
// letters and reading words.
const SYLL = ['ма','мо','му','ла','ло','лу','са','со','су','ка','ко','ку','на','но','ну'];
const syId = s => 'sy_' + {м:'m',л:'l',с:'s',к:'k',н:'n'}[s[0]] + {а:'a',о:'o',у:'u'}[s[1]];
// Слова з відкритих складів — перше справжнє читання. Крапка між складами
// показує, як слово розбирається на частини, які дитина вже впізнає.
const WORDS_READ = [['мама','МА·МА'],['лама','ЛА·МА'],['мука','МУ·КА'],['коло','КО·ЛО'],
  ['молоко','МО·ЛО·КО'],['луна','ЛУ·НА'],['коса','КО·СА'],['лапа','ЛА·ПА']];
const wdId = w => 'wd_' + w.split('').map(c =>
  ({м:'m',л:'l',с:'s',к:'k',н:'n',п:'p',а:'a',о:'o',у:'u'})[c] || '').join('');
function syllTasks(v){
  const nsy = v===1 ? 5 : v===2 ? 3 : 1, m = v===3 ? 4 : 3;
  const t = pick(SYLL, nsy).map(s => {
    const opts = new Set([s]);
    while (opts.size < m) opts.add(SYLL[rnd(SYLL.length)]);
    return {prompt:'Покажи склад, який почуєш', speak:[P.syll,[syId(s), s]],
      stage:'', answer:s,
      options: shuffle([...opts]).map(x => ({v:x, html: x.toUpperCase()}))};
  });
  for (const [w, split] of pick(WORDS_READ, 5 - nsy)){
    const opts = shuffle([[w,split]].concat(pick(WORDS_READ.filter(x=>x[0]!==w), m-1)));
    t.push({prompt:'Яке слово ти чуєш?', speak:[P.word,[wdId(w), w]], stage:'',
      answer:w, options: opts.map(([x,s]) => ({v:x, html:s}))});
  }
  return shuffle(t);
}

const SYLW = [['w_kit',1],['w_slon',1],['w_ryba',2],['w_sontse',2],['w_khata',2],

  ['w_derevo',3],['w_podarunok',4]];
function soundTasks(v){
  const t = [];
  const pool = v===1 ? SYLW.filter(w=>w[1]<=2) : v===2 ? SYLW.filter(w=>w[1]<=3) : SYLW;
  const top = v===3 ? 4 : 3;
  for (const [id, k] of pick(pool, v===3 ? 3 : 5)){
    const w = BY_ID[id], opts = new Set([k]);

      stage:`<span class="big">${pic(id, w[1])}</span><span class="word">${w[2]}</span>`,
      answer:String(k),
      options: shuffle([...opts]).map(x => ({v:String(x), html:String(x)}))});
  }
  for (let i=0; i<(v===3 ? 2 : 0); i++){
    let a, b, spin = 0;
    do { [a, b] = pick(SYLW, 2); } while (a[1] === b[1] && spin++ < 60);
    t.push({prompt:'У якому слові більше частин?',
      speak:[P.partsMore, [a[0], BY_ID[a[0]][2]], [b[0], BY_ID[b[0]][2]]],
      stage:'', answer: a[1] > b[1] ? a[0] : b[0],
      options: [a, b].map(x => ({v:x[0], html: pic(x[0], BY_ID[x[0]][1])}))});
  }
  return shuffle(t);
}

// ---------- Shapes and colours. The other answers differ from the right one

const FIG = [['circle','круг','sh_circle'],['square','квадрат','sh_square'],

  ['oval','овал','sh_oval']];

  ['yellow','жовтий','c_yellow'],['green','зелений','c_green']];
function figTasks(v){
  const m = v===1 ? 3 : v===2 ? 4 : 5;
  return Array.from({length:5}, () => {
    const f = FIG[rnd(FIG.length)], c = FIGCOL[rnd(FIGCOL.length)];

// ---------- More, fewer, the same: counting without counting out loud.
function compareTasks(v){
  return Array.from({length:5}, () => {
    const f = FRUIT[rnd(FRUIT.length)], p = pic(f[0], f[1]);
    let a, b;
    if (v===1){ a = 1 + rnd(4); b = a + 2 + rnd(2); if (rnd(2)) [a,b] = [b,a]; }
    else if (v===2){ a = 1 + rnd(6); b = 1 + rnd(6); if (rnd(4) === 0) b = a; }
    else { a = 4 + rnd(6); b = Math.max(1, a + (rnd(3) - 1)); }
    return {prompt:'Де більше?', speak:[P.more],
      stage:`<span class="side">${p.repeat(a)}</span><span class="vs">і</span>`
            + `<span class="side">${p.repeat(b)}</span>`,
      answer: a > b ? 'left' : a < b ? 'right' : 'same',
      // Стрілки текстом, не емодзі: емодзі-стрілки є не в кожному шрифті
      // і на частині пристроїв показуються порожнім прямокутником.
      options:[say1('left','← зліва','a_more_l'), say1('same','= порівну','a_same'),
               say1('right','справа →','a_more_r')]};
  });
}

// ---------- Making a number up: "there were three, how many more to make
// five". The step between counting and real addition.
function numTasks(v){
  const hi = v===1 ? 5 : 10;
  return Array.from({length:5}, () => {
    const total = (v===1 ? 3 : 4) + rnd(hi - (v===1 ? 2 : 3));
    const have = 1 + rnd(total - 1), need = total - have;
    const f = FRUIT[rnd(FRUIT.length)], p = pic(f[0], f[1]);
    return {prompt:`Було ${have}. Скільки треба додати, щоб стало ${total}?`,
      speak:[P.was, n(have), P.addto, n(total)],
      stage:`<span class="side">${p.repeat(have)}</span><span class="op">+</span>`
            + `<span class="slot">?</span><span class="word">${have} + ? = ${total}</span>`,
      answer:String(need), options: numOpts(need, 1, 9, v===3 ? 4 : 3)};
  });
}

// ---------- Which one is third: counting positions, not amounts.
const ORD = ['перша','друга','третя','четверта',"п'ята"];

  const len = v===1 ? 3 : 5, m = v===3 ? 4 : 3;
  return Array.from({length:5}, () => {
    const row = pick(WORDS, len), k = rnd(len), right = row[k];
    const opts = shuffle([right].concat(pick(row.filter(w => w !== right), m-1)));
    return {prompt:`Яка картинка ${ORD[k]}?`, speak:[[`or_${k+1}`, `Яка картинка ${ORD[k]}?`]],
      stage:`<span class="rowpics">${row.map(w => pic(w[0], w[1])).join('')}</span>`,
      answer:right[0], options: opts.map(w => ({v:w[0], html: pic(w[0], w[1])}))};
  });
}

  {id:'money', img:'i_money', ico:'🪙', vo:'nm_money', name:'Острів Гривні', about:'Порахуй гроші', gen:moneyTasks},
  {id:'syll', img:'i_syll', ico:'🔊', vo:'nm_syll', name:'Острів Читання', about:'Склади і перші слова на слух', gen:syllTasks},
  {id:'sound', img:'i_sound', ico:'👏', vo:'nm_sound', name:'Острів Звуків', about:'Скільки частин у слові', gen:soundTasks},
  {id:'fig', img:'i_fig', ico:'🔷', vo:'nm_fig', name:'Острів Фігур', about:'Фігури й кольори на слух', gen:figTasks},
  {id:'shadow', img:'i_shadow', ico:'🌑', vo:'nm_shadow', name:'Острів Тіней', about:'Упізнай предмет за тінню', gen:shadowTasks},

  {id:'num', img:'i_num', ico:'➕', vo:'nm_num', name:'Острів Чисел', about:'Скільки треба додати', gen:numTasks},

  {id:'place', img:'i_place', ico:'📍', vo:'nm_place', name:'Острів Напрямків', about:'Вгорі, внизу, поруч', gen:placeTasks},

];
const BY_LES = Object.fromEntries(LESSONS.map(l => [l.id, l]));
// Вісімнадцять островів в одному списку дитина не охопить оком, тому вони
// зібрані в чотири моря — і видно, де чого ще не зібрано.
const SEAS = [
  {id:'snum',   ico:'🔢', vo:'sea_num',   name:'Море Чисел',
   ls:['math','num','compare','order','money','time']},

   ls:['read','syll','sound','write','en']},

   ls:['world','weather','place','fig']},
  {id:'smind',  ico:'🧠', vo:'sea_mind',  name:'Море Уваги',
   ls:['memo','logic','shadow']},
];
// Наліпки — ті самі картинки, що й у завданнях: домальовувати нічого не
// довелося, а колекція з двадцяти п'яти збирається якраз за чверть.
const STICKERS = WORDS.map(w => [w[0], w[1]]).concat(FRUIT);

// ---------- Screens
function kidStars(k){
  let s = 0;
  for (const v of Object.values(k.stars || {}))
    s += typeof v === 'number' ? v : Object.values(v).reduce((a,b)=>a+b, 0);
  return s;
}
function who(){
  $('#me').hidden = true; $('#total').textContent = 0;
  $('#crab').hidden = true; $('#help').hidden = true;
  const list = Object.entries(DB.kids);
  $('#app').innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    <p class="lead">Хто сьогодні грає?</p>
    <div class="map">${list.map(([id,k])=>`<div class="kidwrap">
        <button class="island" data-id="${id}"><span class="ico">${k.ava}</span>
          <h2>${k.name}</h2><p>Зірок: ${kidStars(k)}</p></button>
        <button class="x" data-del="${id}" aria-label="Прибрати ${k.name}">×</button></div>`).join('')}
      <button class="island" id="add"><span class="ico">➕</span><h2>Новий гравець</h2>
        <p>Для нової дитини</p></button></div></div>`;
  document.querySelectorAll('.island[data-id]').forEach(b => b.onclick = () => {
    DB.cur = b.dataset.id; save(); home(); });
  document.querySelectorAll('.x').forEach(b => b.onclick = () => {
    const k = DB.kids[b.dataset.del];
    if (!confirm(`Прибрати гравця ${k.name}? Зірки зникнуть.`)) return;
    delete DB.kids[b.dataset.del];
    if (DB.cur === b.dataset.del) DB.cur = null;
    save(); who(); });
  $('#add').onclick = addKid;
}

function addKid(){
  let ava = AVATARS[rnd(AVATARS.length)];
  $('#app').innerHTML = `<section class="lesson">
    <h3 style="font-family:var(--display);margin:0">Новий гравець</h3>
    <input class="nm" id="nm" maxlength="14" placeholder="Ім'я" autocomplete="off">
    <div class="avas">${AVATARS.map(a=>`<button class="ava${a===ava?' on':''}" data-a="${a}">${a}</button>`).join('')}</div>
    <div class="row"><button class="next" id="ok">Готово</button>
      <button class="back" id="cancel">Назад</button></div></section>`;
  document.querySelectorAll('.ava').forEach(b => b.onclick = () => {
    ava = b.dataset.a;
    document.querySelectorAll('.ava').forEach(x => x.classList.toggle('on', x === b)); });
  $('#cancel').onclick = who;
  $('#ok').onclick = () => {
    const id = 'k' + Date.now();
    DB.kids[id] = {name: ($('#nm').value || '').trim() || 'Гравець', ava, stars:{}, st:{},
      day:'', trips:0, log:[]};
    DB.cur = id; save(); home();
  };
  $('#nm').focus();
}

function totalStars(){
  return LESSONS.reduce((a, l) => a + lessonStars(l.id), 0);
}
// Прапорець — за перші три зірки, трофей — коли всі дев'ять: щоб здалеку
// було видно, де дитина вже була і де вже нічого не лишилось.
const mark = s => s >= 9 ? '🏆' : s >= 3 ? '🚩' : '';
// Острів, на якому краб щойно поставив прапорець: його прапорець прилітає
// згори, а не просто з'являється між двома екранами.
let NEWFLAG = null;
function islandCard(l, fresh){
  const s = lessonStars(l.id), m = mark(s);
  return `<button class="island" data-id="${l.id}">
    <span class="ico">${pic(l.img, l.ico)}${m ? `<b class="flag${fresh ? ' new' : ''}">${m}</b>` : ''}</span>
    <h2>${l.name}</h2><p>${l.about}</p>
    <span class="got${s>6?' nine':''}">${'★'.repeat(s)}<i>${'★'.repeat(9-s)}</i></span></button>`;
}
function home(){
  if (!kid()) return who();
  $('#total').textContent = totalStars();
  $('#me').hidden = false;
  $('#me').textContent = `${kid().ava} ${kid().name}`;
  $('#help').hidden = false;
  $('#help').textContent = helpCfg().off ? '🦀 Покликати' : '🦀 Клац';
  const k = kid(), doneToday = k.day === today();
  const mine = Object.keys(k.st || {}).length;
  $('#app').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <p class="lead">Обери острів. На кожному три рівні. Якщо помилишся, не страшно: з'явиться підказка.</p>
    <div class="map">
      <button class="island" id="trip" ${doneToday ? 'disabled' : ''}>
        <span class="ico">${doneToday ? '✅' : '🧭'}</span>
        <h2>Щоденна мандрівка</h2>
        <p>${doneToday ? 'Сьогодні вже пройдено. Приходь завтра!' : "П'ять завдань з різних островів"}</p></button>
      <button class="island" id="alb"><span class="ico">🏅</span><h2>Мої наліпки</h2>
        <p>Зібрано ${mine} із ${STICKERS.length}</p></button>
    </div>
    ${SEAS.map(s => {
      const got = s.ls.reduce((a,id)=>a+lessonStars(id), 0), max = s.ls.length*9;
      return `<div class="seahead"><span class="ico">${s.ico}</span>${s.name}
        <b>${got} / ${max} ★</b></div>
      <div class="map">${s.ls.map(id => islandCard(BY_LES[id], id === NEWFLAG)).join('')}</div>`;
    }).join('')}</div>`;
  document.querySelectorAll('.island[data-id]').forEach(b => b.onclick = () => levels(b.dataset.id));
  $('#trip').onclick = startDaily;
  $('#alb').onclick = album;
  if (NEWFLAG){
    const sel = `.island[data-id="${NEWFLAG}"] .flag`;
    NEWFLAG = null;
    guide(CRAB.flag, true, sel);
  } else {
    guide(CRAB.hi, !greeted); greeted = true;
  }
}

// Альбом наліпок: зібрані кольорові, решта — сірі силуети. Саме за цим
// діти повертаються на вже пройдений урок удесяте.
function album(){
  const st = kid().st || {};
  $('#app').innerHTML = `<section class="lesson">
    <div class="bar"><button class="back" id="back">← Карта</button></div>
    <div class="q"><h3>Мої наліпки</h3><button class="say" id="say" aria-label="Послухати">🔊</button></div>
    <p class="lead" style="text-align:center">Зібрано ${Object.keys(st).length} із ${STICKERS.length}.
      Нова наліпка — за три зірки й за щоденну мандрівку.</p>
    <div class="album">${STICKERS.map(([id, emo]) => {
      const c = st[id] || 0;
      return `<div class="${c ? '' : 'off'}">${pic(id, emo)}${c>1 ? `<b>×${c}</b>` : ''}</div>`;
    }).join('')}</div></section>`;
  $('#back').onclick = home;
  $('#say').onclick = () => say([CRAB.album]);
  guide(CRAB.album, true);
}

// Вибір рівня. Закритий рівень лишається видимим, але підписано, що
// відкриє його — дитина бачить, куди рухатись.
function levels(id){
  const l = BY_LES[id];
  $('#app').innerHTML = `<section class="lesson">
    <div class="bar"><button class="back" id="back">← Карта</button></div>
    <div class="q"><h3>${l.name}</h3><button class="say" id="say" aria-label="Послухати">🔊</button></div>
    <p class="lead" style="text-align:center">${l.about}</p>
    <div class="map lvls">${LEVELS.map(v => {
      const got = starsAt(id, v.n), open = levelOpen(id, v.n);
      return `<button class="island lvl${open ? '' : ' shut'}" data-l="${v.n}" ${open ? '' : 'disabled'}>
        <span class="ico">${open ? v.ico : '🔒'}</span><h2>${v.name}</h2>
        <span class="got">${'★'.repeat(got)}<i>${'★'.repeat(3-got)}</i></span>
        ${open ? '' : '<p>Потрібні дві зірки на попередньому</p>'}</button>`;
    }).join('')}</div></section>`;
  $('#back').onclick = home;
  const line = [[l.vo, l.name], CRAB.lvl];
  $('#say').onclick = () => say(line);
  say(line);
  guide(CRAB.lvl, false, null, 'walk');   // краб «доходить» до острова
  document.querySelectorAll('.lvl').forEach(b =>
    b.onclick = () => start(id, Number(b.dataset.l)));
}

let L, lvl, tasks, idx, mistakes, tries, DAILY = false;
function start(id, v){
  DAILY = false;
  L = BY_LES[id]; lvl = v || 1;
  tasks = L.gen(lvl); idx = 0; mistakes = 0;
  show();
  // Після show(), а не до нього: краб показує клешнею на саме завдання,
  // а воно з'являється на екрані щойно тут. На Острові Звуків він плеще
  // склади разом із дитиною, у Морі Мови — читає з книжкою.
  const lang = SEAS.find(s => s.id === 'slang').ls.includes(id);
  guide(CRAB.go, false, '.stage, .cards, .trace',
        id === 'sound' ? 'clap' : lang ? 'read' : 'point');
}
// Щоденна мандрівка: по одному завданню з п'яти різних островів, три
// хвилини — і наліпка. Привід зайти в гру щодня, навіть коли всі зірки є.
function startDaily(){
  DAILY = true;
  L = {id:'daily', name:'Щоденна мандрівка', vo:'p_daily'};
  lvl = 0; idx = 0; mistakes = 0; tasks = [];
  for (const l of pick(LESSONS.filter(x => x.id !== 'memo'), 5)){
    const got = l.gen(1 + rnd(2));
    tasks.push(got[rnd(got.length)]);
  }
  guide(CRAB.daily, true, null, 'swim');   // мандрівка — краб пливе
  show();
}

function show(){
  const t = tasks[idx]; tries = 0;
  $('#app').innerHTML = `<section class="lesson">
    <div class="bar"><button class="back" id="back">← Карта</button>
      <div class="progress">${tasks.map((_,i)=>`<span class="${i<idx?'done':i===idx?'now':''}"></span>`).join('')}</div></div>
    <div class="q"><h3>${t.prompt}</h3><button class="say" id="say" aria-label="Послухати ще раз">🔊</button></div>
    <div id="body"></div>
    <p class="msg" id="msg" aria-live="polite"></p></section>`;
  $('#back').onclick = home;
  // Варіанти словами читаються вслід за питанням: дитина 1 класу їх не прочитає.
  const full = () => t.speak.concat(
    (t.options || []).filter(o => o.vo && o.tx).map(o => [o.vo, o.tx]));
  $('#say').onclick = () => say(full());
  (t.kind === 'memo' ? showMemo : t.kind === 'trace' ? showTrace : showChoice)(t, $('#body'));
  if (DAILY && idx === 0) setTimeout(() => say(full()), 2800);   // спершу краб
  else say(full());
}

// Shared ending of a task: praise, then the button to move on.
function pass(hostEl, praise){
  const msg = $('#msg');
  if (praise !== false){ const p = PRAISE[rnd(PRAISE.length)];
    msg.className='msg good'; msg.textContent=p[1]; say([p]); }
  const nx = document.createElement('button'); nx.className='next';
  nx.textContent = idx<tasks.length-1 ? 'Далі →' : 'Готово';
  nx.onclick = ()=>{ idx++; idx<tasks.length ? show() : finish(); };
  hostEl.closest('.lesson').appendChild(nx); nx.focus();
}

function showChoice(t, host){
  const cls = t.options.length === 2 ? ' two' : t.options.length > 3 ? ' many' : '';
  host.innerHTML = `${t.stage ? `<div class="stage">${t.stage}</div>` : ''}
    <div class="answers${cls}">${t.options.map(o=>{
      // Цифра чи буква має бути велика, а підпис на кілька слів — ні.
      const long = !o.html.includes('<img') && [...o.html].length > 2;
      return `<button class="ans${long?' txt':''}" data-v="${o.v}">${o.html}`
        + (long && o.vo ? '<b class="sp">🔊</b>' : '') + '</button>';
    }).join('')}</div>`;
  host.querySelectorAll('.ans').forEach(b => b.onclick = e => {
    const o = t.options.find(x => String(x.v) === b.dataset.v);
    // Маленький 🔊 на кнопці читає саме цю відповідь і нічого не обирає.
    if (e.target.closest('.sp')){ if (o && o.vo) say([[o.vo, o.tx || '']]); return; }
    answer(b, t);
  });
}

function answer(btn,t){
  const msg = $('#msg');
  if (btn.dataset.v === t.answer){
    btn.classList.add('ok'); document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
    sfxOk(); guide(CRAB.good, false);
    pass(btn);
  } else {
    tries++; mistakes++; btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no'); btn.disabled = true;
    sfxNo(); guide(CRAB.oops, false);
    msg.className='msg bad';
    if (tries===1){ msg.textContent='Спробуй ще раз'; say([P.tryagain]); }
    else {
      const right = document.querySelector(`.ans[data-v="${CSS.escape(t.answer)}"]`);
      right.classList.add('hint');
      msg.textContent='Підказка: правильна відповідь обведена'; say([P.hint]);
      // Краб не просто каже «дивись» — він повертається і показує клешнею
      // саме на ту кнопку.
      guide(CRAB.hint, false, right);
    }
  }
}

// ---------- Memory: two taps open two cards; a pair stays open and is named
function showMemo(t, host){
  const deck = shuffle(t.pairs.concat(t.pairs));
  const cols = Math.ceil(deck.length/2);
  host.innerHTML = `<div class="cards" style="grid-template-columns:repeat(${cols},1fr)">${
    deck.map(w=>`<button class="card" data-id="${w[0]}"><span class="face">${pic(w[0],w[1])}</span></button>`).join('')}</div>`;
  let open = [], miss = 0, lock = false, left = t.pairs.length;
  host.querySelectorAll('.card').forEach(c => c.onclick = () => {
    if (lock || c.classList.contains('open') || c.classList.contains('done')) return;
    c.classList.add('open'); open.push(c);
    if (open.length < 2) return;
    const [a,b] = open;
    if (a.dataset.id === b.dataset.id){
      open = []; a.classList.add('done'); b.classList.add('done');
      const w = t.pairs.find(p => p[0] === a.dataset.id);
      sfxOk(); say([P.pair,[w[0],w[2]]]);
      // Wrong pairs are the game, not mistakes. Simulated play: even with
      // perfect recall a child turns up about three wrong pairs per round of
      // four, so the old "one free" rule handed out one star every single
      // time. Free allowance is pairs+1, and only beyond that does every
      // second wrong pair count as a mistake.
      if (--left === 0){
        mistakes += Math.max(0, Math.ceil((miss - (t.pairs.length + 1)) / 2));
        pass(host);
      }
    } else {
      lock = true; miss++; sfxNo();
      const msg = $('#msg'); msg.className='msg bad'; msg.textContent='Не збіглося — спробуй ще';
      setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open');
        open = []; lock = false; msg.textContent=''; }, 900);
    }
  });
}

// ---------- Tracing: finger draws on the top canvas, the letter sits under it.
// Scoring: how much of the letter is covered, and how much ink went outside it.
function showTrace(t, host){
  host.innerHTML = `<div class="trace">
    <div class="pad"><canvas class="glyph"></canvas><canvas class="ink"></canvas></div>
    <div class="row"><button class="back" id="clear">Стерти</button>
      <button class="next" id="check">Готово</button></div></div>`;
  const S = 320;                                   // internal size; CSS scales it
  const gc = host.querySelector('canvas.glyph'), ic = host.querySelector('canvas.ink');
  [gc,ic].forEach(c => { c.width = S; c.height = S; });
  const g = gc.getContext('2d'), k = ic.getContext('2d');
  const font = `700 ${S*0.72}px "Comfortaa","Nunito",system-ui,sans-serif`;

  function drawGlyph(bold){
    g.clearRect(0,0,S,S); g.textAlign='center'; g.textBaseline='middle'; g.font = font;
    g.fillStyle = bold ? 'rgba(47,127,153,.5)' : 'rgba(47,127,153,.25)';
    g.fillText(t.glyph, S/2, S/2);
  }
  drawGlyph(false);

  // Two masks off-screen: the letter itself, and the letter widened by a finger.
  const mask = document.createElement('canvas'); mask.width = mask.height = S;
  const m = mask.getContext('2d');
  m.textAlign='center'; m.textBaseline='middle'; m.font = font; m.fillStyle='#000';
  m.fillText(t.glyph, S/2, S/2);
  const strict = m.getImageData(0,0,S,S).data;
  m.lineWidth = 46; m.strokeStyle='#000'; m.strokeText(t.glyph, S/2, S/2);
  const wide = m.getImageData(0,0,S,S).data;

  k.lineWidth = 26; k.lineCap='round'; k.lineJoin='round'; k.strokeStyle='#e8684a';
  let drawing = false, last = null, painted = false;
  const pt = e => { const r = ic.getBoundingClientRect();
    return [(e.clientX-r.left)*S/r.width, (e.clientY-r.top)*S/r.height]; };
  ic.addEventListener('pointerdown', e => {
    try { ic.setPointerCapture(e.pointerId); } catch(err){}
    drawing = true; last = pt(e); painted = true;
    k.beginPath(); k.moveTo(last[0], last[1]); k.lineTo(last[0]+0.1, last[1]); k.stroke();
  });
  ic.addEventListener('pointermove', e => {
    if (!drawing) return; const p = pt(e);
    k.beginPath(); k.moveTo(last[0], last[1]); k.lineTo(p[0], p[1]); k.stroke(); last = p;
  });
  const stop = () => { drawing = false; };
  ic.addEventListener('pointerup', stop);
  ic.addEventListener('pointercancel', stop);

  const clear = () => { k.clearRect(0,0,S,S); painted = false; };
  host.querySelector('#clear').onclick = clear;
  host.querySelector('#check').onclick = () => {
    const msg = $('#msg');
    if (!painted){ msg.className='msg bad'; msg.textContent='Спершу обведи пальцем'; return; }
    const ink = k.getImageData(0,0,S,S).data;
    let hit = 0, need = 0, stray = 0, all = 0;
    for (let i=3; i<ink.length; i+=4){
      const on = ink[i] > 40;
      if (strict[i] > 40){ need++; if (on) hit++; }
      if (on){ all++; if (wide[i] <= 40) stray++; }
    }
    const cover = need ? hit/need : 0, out = all ? stray/all : 1;
    // Складний рівень вимагає точнішої лінії; друга спроба на будь-якому
    // рівні оцінюється м'якше — мета, щоб дитина провела лінію, а не здалась.
    const ok = t.hard
      ? (tries===0 ? (cover>=.65 && out<=.28) : (cover>=.5 && out<=.42))
      : (tries===0 ? (cover>=.55 && out<=.35) : (cover>=.4 && out<=.5));
    if (ok){
      host.querySelector('.row').remove();
      msg.className='msg good'; msg.textContent='Гарно написано!';
      sfxOk(); say([P.traceOk]); guide(CRAB.good, false);
      pass(host, false);
    } else {
      tries++; mistakes++; msg.className='msg bad'; sfxNo();
      if (tries===1){ msg.textContent='Майже! Спробуй ще раз'; say([P.traceTry]); }
      else { drawGlyph(true); msg.textContent='Веди пальцем по товстій лінії'; say([P.hint]); }
      clear();
    }
  };
}

// Наліпка: спершу та, якої ще немає — колекція має наповнюватись, а не
// видавати те саме вдесяте. Коли всі зібрані, йде друга копія.
function award(k){
  k.st = k.st || {};
  const missing = STICKERS.filter(([id]) => !k.st[id]);
  const from = missing.length ? missing : STICKERS;
  const s = from[rnd(from.length)];
  k.st[s[0]] = (k.st[s[0]] || 0) + 1;
  return [s, missing.length > 0];
}

function finish(){
  const s = mistakes===0?3: mistakes<=2?2:1;
  const k = kid();
  if (DAILY){ k.day = today(); k.trips = (k.trips || 0) + 1; }
  else {
    const was = mark(lessonStars(L.id));
    const at = k.stars[L.id] || (k.stars[L.id] = {});
    at[lvl] = Math.max(at[lvl] || 0, s);
    // Прапорець чи трофей щойно з'явився — краб поставить його на карті.
    if (mark(lessonStars(L.id)) !== was) NEWFLAG = L.id;
  }
  // Журнал — для звіту вчителю: що саме проходили і як вийшло.
  k.log.push({l:L.id, v:lvl, s, m:mistakes, n:tasks.length, t:Date.now()});
  if (k.log.length > 300) k.log = k.log.slice(-300);
  // Наліпка — за три зірки й за кожну щоденну мандрівку.
  const gift = (s === 3 || DAILY) ? award(k) : null;
  save();
  report({kid:k.name, ava:k.ava, lesson:L.id, lvl, stars:s, mistakes, n:tasks.length, t:Date.now()});
  $('#total').textContent = totalStars();
  const lname = DAILY ? 'Щоденна мандрівка' : `${L.name}, ${LEVELS[lvl-1].name}`;
  $('#app').innerHTML = `<section class="lesson finish">
    <div class="big">${'★'.repeat(s)}</div><h3>${FIN[s][1]}</h3>
    <p class="lead">${lname}: ${tasks.length} із ${tasks.length} завдань. Помилок: ${mistakes}.</p>
    ${gift ? `<div class="gift">${pic(gift[0][0], gift[0][1])}
      <span>${gift[1] ? 'Нова наліпка в альбомі!' : 'Ще одна така наліпка!'}</span></div>` : ''}
    <div class="row">
      ${DAILY ? '' : '<button class="next" id="again">Ще раз</button>'
        + '<button class="back" id="lv">Інший рівень</button>'}
      <button class="back" id="alb">Альбом</button>
      <button class="back" id="map">До карти</button></div></section>`;
  sfxWin();
  const chain = [FIN[s], P.get, STARS[s]];
  if (gift){ chain.push(P.gift); setTimeout(sfxGift, 1200); }
  say(chain);
  guide(s === 3 ? CRAB.fin3 : CRAB.fin, false, gift ? '.gift' : null,
        s === 3 ? 'star' : 'joy');
  if (!DAILY){
    $('#again').onclick = () => start(L.id, lvl);
    $('#lv').onclick = () => levels(L.id);
  }
  $('#alb').onclick = album;
  $('#map').onclick = home;
}

$('#me').onclick = who;
flush();                       // те, що не дійшло минулого разу
kid() ? home() : who();
</script>
