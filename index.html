// ---------- Острів Речення: велика літера, крапка, знак питання й оклику,
// скільки слів. Читати дитина ще не вміє, тому речення й звучить.
const SENTS = [
  ['Кіт спить.', 2, '.', 's_kit'],
  ['Мама пече пиріг.', 3, '.', 's_mama'],
  ['Де мій зошит?', 3, '?', 's_de'],
  ['Яка гарна квітка!', 3, '!', 's_yaka'],
  ['Тато читає книжку.', 3, '.', 's_tato'],
  ['Хто там?', 2, '?', 's_khto'],
  ['Ура, канікули!', 2, '!', 's_ura'],
  ['Пташка летить високо.', 3, '.', 's_ptashka'],
];
function sentTasks(v){
  const t = [];
  for (const [s, k, mark, id] of pick(SENTS, 3)){
    if (v === 1){
      t.push({prompt:'Скільки слів у реченні?', speak:[[id, s], ['q_words','Скільки слів у реченні?']],
        stage:`<span class="word">${s}</span>`, answer:String(k),
        options: numOpts(k, 1, 5, 3)});
    } else {
      t.push({prompt:'Який знак має стояти в кінці?',
        speak:[[id, s], ['q_mark','Який знак має стояти в кінці?']],
        stage:`<span class="word">${s.slice(0, -1)} ?</span>`, answer:mark,
        options: shuffle(['.', '?', '!']).map(x => ({v:x, html:x}))});
    }
  }
  while (t.length < 5){
    const [s] = SENTS[rnd(SENTS.length)];
    const low = s[0].toLowerCase() + s.slice(1);
    t.push({prompt:'Яке речення записано правильно?',
      speak:[['q_cap','Яке речення записано правильно? Речення починається з великої букви.']],
      stage:'', answer:'ok',
      options: shuffle([{v:'ok', html:s}, {v:'no', html:low}])});
  }
  return shuffle(t);
}

// ---------- Острів Алфавіту: яка буква сусідня і де можна перенести слово.
const ABC = 'АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ'.split('');
const HYPH = [['ма-ма','мама'],['во-да','вода'],['ри-ба','риба'],
  ['кві-тка','квітка'],['до-ро-га','дорога'],['ра-ке-та','ракета'],
  ['су-мка','сумка'],['мо-ло-ко','молоко']];
function abcTasks(v){
  const t = [];
  for (let i = 0; i < 3; i++){
    const k = 1 + rnd(ABC.length - 2), after = rnd(2) === 1;
    const right = after ? ABC[k+1] : ABC[k-1];
    const opts = new Set([right]);
    while (opts.size < (v === 3 ? 4 : 3)) opts.add(ABC[rnd(ABC.length)]);
    t.push({prompt: after ? `Яка буква йде після ${ABC[k]}?` : `Яка буква йде перед ${ABC[k]}?`,
      speak:[[after ? 'q_lafter' : 'q_lbefore',
              after ? 'Яка буква йде після цієї?' : 'Яка буква йде перед цією?']],
      stage:`<span class="word">${ABC[k]}</span>`, answer:right,
      options: shuffle([...opts]).map(x => ({v:x, html:x}))});
  }
  for (const [split, w] of pick(HYPH, 2)){
    const wrong = w.slice(0, 1) + '-' + w.slice(1);
    t.push({prompt:'Як правильно перенести слово?',
      speak:[['q_hyph','Як правильно перенести слово? Переносимо по складах.'], ['hw_'+uaId(w), w]],
      stage:'', answer:split,
      options: shuffle([{v:split, html:split}, {v:wrong, html:wrong}])});
  }
  return shuffle(t);
}

// ---------- Острів Значень: близькі й протилежні слова, слова з двома
// значеннями. Усі варіанти озвучені — читати їх дитина ще не може.
const SYN = [['великий','здоровенний','v_zdorovennyj'],['гарний','красивий','v_krasyvyj'],
  ['швидко','хутко','v_khutko'],['сумний','невеселий','v_neveselyj'],['холодний','студений','v_studenyj']];
const ANT = [['великий','малий','v_vel','v_mal'],['високий','низький','v_vys','v_nyz'],
  ['теплий','холодний','v_tep','v_khol'],['день','ніч','v_den','v_nich'],
  ['далеко','близько','v_dal','v_bly'],['швидко','повільно','v_shv','v_pov']];
const POLY = [['ключ','🔑','🎼'],['коса','💇','🌾'],['лист','🍃','✉️'],['ручка','🖊️','🚪']];
function meanTasks(v){
  const t = [];
  for (const [a, b, vb] of pick(SYN, v === 1 ? 2 : 2)){
    const others = pick(ANT.map(x => x[1]).filter(x => x !== b), 2);
    t.push({prompt:`Яке слово означає майже те саме, що «${a}»?`,
      speak:[['q_syn','Яке слово означає майже те саме?'], ['v_'+uaId(a), a]],
      stage:`<span class="word">${a}</span>`, answer:b,
      options: shuffle([say1(b, b, vb)].concat(others.map(x => say1(x, x, 'v_'+uaId(x)))))});
  }
  for (const [a, b, va, vb] of pick(ANT, 2)){
    const others = pick(ANT.flatMap(x => [x[0], x[1]]).filter(x => x !== a && x !== b), 2);
    t.push({prompt:`Яке слово протилежне до «${a}»?`,
      speak:[['q_ant','Яке слово протилежне за значенням?'], [va, a]],
      stage:`<span class="word">${a}</span>`, answer:b,
      options: shuffle([say1(b, b, vb)].concat(others.map(x => say1(x, x, 'v_'+uaId(x)))))});
  }
  const [w, e1, e2] = POLY[rnd(POLY.length)];
  t.push({prompt:`Слово «${w}» має два значення. Покажи обидва.`,
    speak:[['q_poly','Це слово має два значення.'], ['v_'+uaId(w), w]],
    stage:`<span class="word">${w}</span>`, answer:'both',
    options: shuffle([{v:'both', html:`${e1} ${e2}`},
                      {v:'one', html:`${e1} ${FRUIT[rnd(FRUIT.length)][1]}`}])});
  return shuffle(t).slice(0, 5);
}

  const t = [];

// ---------- Острів Кроків: порядок дій. Те саме, що потім назветься
// алгоритмом, тільки на звичних справах.
const PLANS = [
  ['посадити квітку', ['🕳️','🌰','💧','🌱'], 'pn_kvitka'],
  ['зібратися до школи', ['⏰','🍽️','🎒','🚶'], 'pn_shkola'],
  ['намалювати малюнок', ['📄','✏️','🎨','🖼️'], 'pn_malunok'],
  ['приготувати чай', ['🫖','💧','🔥','🍵'], 'pn_chai'],
  ['перейти дорогу', ['🛑','👀','🚦','🚶'], 'pn_doroha'],
];
function planTasks(v){
  const t = [];
  for (const [what, steps, id] of pick(PLANS, 3)){
    const k = v === 1 ? 0 : rnd(steps.length);
    t.push({prompt:`Щоб ${what}: що робимо ${k === 0 ? 'перш за все' : ORD[k] + ' дією'}?`,
      speak:[[id, 'Щоб ' + what], [k === 0 ? 'q_step1' : 'q_stepn', k === 0 ? 'Що робимо перш за все?' : 'Що робимо далі?']],
      stage: k === 0 ? '' :
        `<span class="rowpics">${steps.slice(0, k).map(e => `<span class="big">${e}</span>`).join('')}</span>`,
      answer: steps[k],
      options: shuffle(steps).map(e => ({v:e, html:`<span class="big">${e}</span>`}))});
  }
  // Помилка в послідовності: що тут стоїть не на своєму місці.
  for (const [what, steps, id] of pick(PLANS, 2)){
    const bad = shuffle(steps.slice());
    const k = bad.findIndex((e, i) => e !== steps[i]);
    t.push({prompt:`Щоб ${what}. Що тут зайве на початку?`,
      speak:[[id, 'Щоб ' + what], ['q_wrongstep','Що тут стоїть не на своєму місці?']],
      stage:`<span class="rowpics">${bad.map(e => `<span class="big">${e}</span>`).join('')}</span>`,
      answer: bad[0] === steps[0] ? bad[k < 0 ? 1 : k] : bad[0],
      options: bad.map(e => ({v:e, html:`<span class="big">${e}</span>`}))});
  }
  return shuffle(t).slice(0, 5);
}

// ============ МОРЕ МИСТЕЦТВА ============
// Музична частина — найігровіша в усьому мистецтві, бо вся на слух.
// Звук беремо з того самого WebAudio, що вже є в грі: файлів не треба,
// а дитина порівнює довжину, швидкість і висоту — для 1 класу цього досить.

const TONE = 523;                             // до першої октави
const long_ = [TONE, .34], short_ = [TONE, .14];
const RHY = [
  ['♩ ♩',       [long_, long_]],
  ['♩ ♪♪',      [long_, short_, short_]],
  ['♪♪ ♩',      [short_, short_, long_]],
  ['♪♪ ♪♪',     [short_, short_, short_, short_]],
  ['♩ ♪♪ ♩',    [long_, short_, short_, long_]],
];
function rhythmTasks(v){
  const m = v === 1 ? 2 : v === 2 ? 3 : 4;
  return Array.from({length:5}, () => {
    const r = RHY[rnd(RHY.length)], id = mkPat(r[1]);
    return {prompt:'Послухай плескання. Який запис підходить?',
      speak:[['q_rhythm','Послухай плескання. Який запис підходить?']],
      stage: earBtn(id, 'Плескання'),
      answer:r[0],
      // Нотні значки — у span.big: інакше гра вважає їх підписом і друкує
      // дрібним текстом, а ♩ від ♪ тоді не відрізнити.
      options: optsFrom(RHY, r, m,
        o => ({v:o[0], html:`<span class="big">${o[0]}</span>`}))};
  });
}

// Темп, гучність і регістр — три різні ознаки звуку, і плутають їх
// постійно. Тому завдання питає щоразу лише про одну.
function tempoTasks(v){
  const t = [];
  const beat = (f, d, n_, gap) => Array.from({length:n_}, () => [f, d]);
  for (let i = 0; i < 2; i++){
    const fast = rnd(2) === 1;
    t.push({prompt:'Швидко чи повільно?', speak:[['q_tempo','Швидко чи повільно?']],
      stage: earBtn(mkPat(beat(TONE, fast ? .08 : .3, 5))),
      answer: fast ? 'fast' : 'slow',
      options:[say1('fast','швидко','a_fast'), say1('slow','повільно','a_slow')]});
  }
  for (let i = 0; i < 2; i++){
    const high = rnd(2) === 1, f = high ? TONE * 2 : TONE / 2;
    t.push({prompt:'Високо чи низько?', speak:[['q_pitch','Високо чи низько?']],
      stage: earBtn(mkPat([[f, .3],[f, .3]])),
      answer: high ? 'high' : 'low',
      options:[say1('high','високо','a_high'), say1('low','низько','a_low')]});
  }
  if (v >= 2){
    const up = rnd(2) === 1;
    const seq = up ? [[262,.2],[330,.2],[392,.2],[523,.3]] : [[523,.2],[392,.2],[330,.2],[262,.3]];
    t.push({prompt:'Мелодія йде вгору чи вниз?',
      speak:[['q_dir','Мелодія йде вгору чи вниз?']],
      stage: earBtn(mkPat(seq)), answer: up ? 'up' : 'down',
      options:[say1('up','вгору','a_up'), say1('down','вниз','a_down')]});
  } else {
    t.push({prompt:'Гучно чи тихо?', speak:[['q_loud','Гучно чи тихо?']],
      stage: earBtn(mkPat([[TONE,.3]])), answer:'loud',
      options:[say1('loud','гучно','a_loud'), say1('quiet','тихо','a_quiet')]});
  }
  return shuffle(t).slice(0, 5);
}

// ---------- Острів Нот: нотний стан, скрипковий ключ, ноти першої октави.
// Ноти малюються в SVG — ще один острів без жодного файлу.
const NOTE_Y = {'до':64,'ре':58,'мі':52,'фа':46,'соль':40,'ля':34,'сі':28};
const NOTE_LIST = Object.keys(NOTE_Y);
function staveSvg(name, withKey){
  const y = NOTE_Y[name];
  const lines = [28,37,46,55,64].map(ly =>
    `<line x1="6" y1="${ly}" x2="114" y2="${ly}" stroke="#44464d" stroke-width="1.4"/>`).join('');
  const ledger = y > 64 ? `<line x1="58" y1="${y}" x2="86" y2="${y}" stroke="#44464d" stroke-width="1.4"/>` : '';
  return `<svg class="stave" viewBox="0 0 120 80">${lines}${ledger}`
    + (withKey ? '<text x="10" y="62" font-size="46" fill="#2f6fa8">\u{1D11E}</text>' : '')
    + `<ellipse cx="72" cy="${y}" rx="7" ry="5" fill="#2f6fa8"/>`
    + `<line x1="79" y1="${y}" x2="79" y2="${y-26}" stroke="#2f6fa8" stroke-width="2"/></svg>`;
}
function notesTasks(v){
  const t = [];
  const pool = v === 1 ? ['до','ре','мі'] : v === 2 ? ['до','ре','мі','фа','соль'] : NOTE_LIST;
  for (const nm of pick(pool, 3))
    t.push({prompt:'Яка це нота?', speak:[['q_note','Яка це нота?']],
      stage: staveSvg(nm, true), answer:nm,
      options: optsFrom(pool, nm, v===1 ? 3 : 4, o => say1(o, o, 'no_'+uaId(o)))});
  t.push({prompt:'Скільки ліній у нотному стані?',
    speak:[['q_stave','Скільки ліній у нотному стані?']],
    stage: staveSvg('соль', true), answer:'5', options: numOpts(5, 3, 7, 3)});
  t.push({prompt:'Як називається цей знак на початку нотного стану?',
    speak:[['q_key','Як називається цей знак на початку нотного стану?']],
    stage:'<span class="big">\u{1D11E}</span>', answer:'скрипковий ключ',
    options: shuffle(['скрипковий ключ','нота','пауза'])
      .map(x => say1(x, x, 'ky_' + uaId(x).slice(0, 10)))});
  return shuffle(t).slice(0, 5);
}

const ornSvg = body => `<svg class="orn" viewBox="0 0 100 60">${body}</svg>`;
function ornamentTasks(v){

    const [a, b] = pick(MOT, 2), len = v === 1 ? 4 : 6;

// ---------- Чверть. Зберігається в профілі дитини, тому в одному класі
// один планшет може стояти і в першокласника, і в того, хто наздоганяє.
// 0 — показати все (так зручно вчителеві й тому, хто грає влітку).
function term(){ const k = kid(); return k && k.term != null ? k.term : 1; }
function setTerm(t){
  const k = kid(); if (!k) return;
  k.term = t; save(); home();
}
const inTerm = l => { const t = term(); return t === 0 || (l.per || 1) <= t; };


// ===== ПЕРЕТЯГУВАННЯ: зʼєднай пари, розклади по кошиках, постав у ряд =====
//
// Навіщо. У грі було 97 % завдань одного вигляду: натисни один варіант із
// кількох. Жест один, і скільки б островів не додавати, рука дитини робить
// те саме. Тут зʼявляються три нові жести. Матеріал для них уже є: в Oak
// National Academy 1 213 завдань типу `match` і 297 типу `order`.
//
// Як це працює на планшеті (HP Elite x2, пальці шестирічки):
//   • тягнути МОЖНА, але НЕ ОБОВʼЯЗКОВО — те саме робиться двома
//     дотиками: торкнувся фішки, торкнувся місця. Частина дітей тягне
//     погано, і без другого способу завдання було б для них непрохідним;
//   • події вказівника (pointer events), а не миші — інакше на сенсорному
//     екрані не працює зовсім;
//   • фішка під пальцем — це КОПІЯ, що летить над сторінкою. Рухати
//     оригінал не можна: він лежить у сітці, і сітка стрибала б;
//   • палець затуляє те, що тягне, тому копія підведена вгору на 28 px;
//   • помилка повертає фішку назад і працює так само, як у звичайних
//     завданнях: перша — «спробуй ще», друга — підказує правильне місце.

// ---------- Побудова завдань
// Спільний вигляд: items — що тягнемо, slots — куди. У кожної фішки `to`
// каже, в яке місце вона має лягти.
function dragTask(kind, prompt, speak, slots, items, extra){
  return Object.assign({kind, prompt, speak, slots, items,
    // options потрібні, щоб кнопка 🔊 вгорі прочитала всі підписи:
    // show() збирає її саме з options.
    options: items.concat(slots).filter(x => x.vo && x.tx)}, extra || {});
}
// Пари: ліворуч нерухомі картки з порожнім місцем, праворуч купка фішок.
// Ліній пальцем не малюємо — на планшеті це найважчий жест із можливих.
const pairTask = (prompt, speak, rows) =>
  dragTask('drag', prompt, speak,
    shuffle(rows).map(r => ({id:'s_' + r.key, html:r.left, vo:r.leftVo, tx:r.leftTx})),
    shuffle(rows).map(r => ({id:'i_' + r.key, html:r.right, vo:r.rightVo, tx:r.rightTx,
                             to:'s_' + r.key})),
    {layout:'pair'});
// Кошики: 2–3 підписані місця, кожне вміщає кілька фішок.
const basketTask = (prompt, speak, baskets, items) =>
  dragTask('drag', prompt, speak,
    baskets.map(b => ({id:'s_' + b.id, html:b.name, vo:b.vo, tx:b.name, many:true})),
    shuffle(items).map(x => ({id:'i_' + x.id, html:x.html, vo:x.vo, tx:x.tx,
                              to:'s_' + x.to})),
    {layout:'basket'});
// Ряд: порожні клітинки по порядку. `seq` подається вже правильно.
const orderTask = (prompt, speak, seq) =>
  dragTask('drag', prompt, speak,
    seq.map((x, i) => ({id:'s_' + i, html:String(i + 1), num:true})),
    shuffle(seq.map((x, i) => Object.assign({}, x, {id:'i_' + i, to:'s_' + i}))),
    {layout:'order'});

// ---------- Показ і перевірка
function showDrag(t, host){
  const lay = t.layout || 'pair';
  const slot = s => `<div class="slot${s.many ? ' many' : ''}${s.num ? ' num' : ''}" `
    + `data-id="${s.id}"><span class="lab">${s.html}</span><span class="drop"></span></div>`;
  const chip = i => `<button class="chip" data-id="${i.id}" data-to="${i.to}">`
    + `${i.html}${i.vo && i.tx && [...String(i.html)].length > 2 ? '<b class="sp">🔊</b>' : ''}</button>`;
  host.innerHTML = `<div class="drag ${lay}">
    <div class="slots">${t.slots.map(slot).join('')}</div>
    <div class="pool">${t.items.map(chip).join('')}</div>
    <p class="tip">Перетягни або торкнись двічі: спершу картки, потім місця.</p></div>`;

  const msg = $('#msg');
  let left = t.items.length, picked = null, tries = {};

  const chips = () => [...host.querySelectorAll('.chip')];
  const slotEl = id => host.querySelector(`.slot[data-id="${CSS.escape(id)}"]`);

  function select(c){
    if (picked === c){ picked.classList.remove('pick'); picked = null; return; }
    if (picked) picked.classList.remove('pick');
    picked = c; c.classList.add('pick');
    const it = t.items.find(x => x.id === c.dataset.id);
    if (it && it.vo) say([[it.vo, it.tx || '']]);
  }

  function drop(c, sEl){
    if (!c || !sEl) return;
    const ok = sEl.dataset.id === c.dataset.to;
    if (ok){
      sEl.querySelector('.drop').appendChild(c);
      c.classList.add('done', 'pick');
      c.classList.remove('pick');
      c.disabled = true;
      picked = null;
      sfxOk();
      if (--left === 0){ guide(CRAB.good, false); pass(host); }
      else { msg.className = 'msg good'; msg.textContent = 'Так!'; }
      return;
    }
    // Помилка — та сама логіка, що у звичайних завданнях: спершу «спробуй
    // ще», і лише з другого разу гра показує, куди саме.
    const k = c.dataset.id;
    tries[k] = (tries[k] || 0) + 1;
    mistakes++;
    sfxNo();
    sEl.classList.remove('no'); void sEl.offsetWidth; sEl.classList.add('no');
    guide(CRAB.oops, false);
    if (tries[k] === 1){
      msg.className = 'msg bad'; msg.textContent = 'Не сюди — спробуй ще';
      say([P.tryagain]);
    } else {
      const right = slotEl(c.dataset.to);
      if (right) right.classList.add('hint');
      msg.className = 'msg bad'; msg.textContent = 'Підказка: потрібне місце обведено';
      say([P.hint]);
      if (right) guide(CRAB.hint, false, right);
    }
  }

  // --- два дотики
  host.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', e => {
      if (c.disabled) return;
      if (e.target.closest('.sp')){
        const it = t.items.find(x => x.id === c.dataset.id);
        if (it && it.vo) say([[it.vo, it.tx || '']]);
        return;
      }
      if (!c.dataset.moved) select(c);
      delete c.dataset.moved;
    });
  });
  host.querySelectorAll('.slot').forEach(s => {
    s.addEventListener('click', () => { if (picked) drop(picked, s); });
  });

  // --- тягнення
  let ghost = null, from = null, startX = 0, startY = 0, moved = false;
  host.addEventListener('pointerdown', e => {
    const c = e.target.closest('.chip');
    if (!c || c.disabled || e.target.closest('.sp')) return;
    from = c; moved = false; startX = e.clientX; startY = e.clientY;
    c.setPointerCapture(e.pointerId);
  });
  host.addEventListener('pointermove', e => {
    if (!from) return;
    if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) < 8) return;
    if (!moved){
      moved = true;
      const r = from.getBoundingClientRect();
      ghost = from.cloneNode(true);
      ghost.className = 'chip ghost';
      ghost.style.width = r.width + 'px';
      ghost.style.height = r.height + 'px';
      document.body.appendChild(ghost);
      from.classList.add('taken');
      if (picked){ picked.classList.remove('pick'); picked = null; }
    }
    // Палець затуляє фішку, тому вона летить вище за точку дотику.
    ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + 'px';
    ghost.style.top = (e.clientY - ghost.offsetHeight / 2 - 28) + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY - 28);
    host.querySelectorAll('.slot.over').forEach(s => s.classList.remove('over'));
    const s = under && under.closest && under.closest('.slot');
    if (s) s.classList.add('over');
  });
  const end = e => {
    if (!from) return;
    const c = from; from = null;
    if (!moved){ return; }
    c.dataset.moved = '1';
    c.classList.remove('taken');
    const x = e.clientX, y = e.clientY - 28;
    if (ghost){ ghost.remove(); ghost = null; }
    host.querySelectorAll('.slot.over').forEach(s => s.classList.remove('over'));
    const under = document.elementFromPoint(x, y);
    const s = under && under.closest && under.closest('.slot');
    if (s) drop(c, s);
  };
  host.addEventListener('pointerup', end);
  host.addEventListener('pointercancel', e => {
    if (ghost){ ghost.remove(); ghost = null; }
    if (from) from.classList.remove('taken');
    from = null;
  });
}

// ============ ДОМІШУВАННЯ ДО ОСТРОВІВ ============
// Не замінюємо генератори, а підмішуємо: одне-два з пʼяти завдань стають
// перетягуванням. Так кожен захід на острів інший, і жоден із наявних
// генераторів не довелося переписувати.
function mixDrag(base, makers, howMany){
  return function (v){
    const t = base(v);
    const k = Math.min(howMany, t.length - 1);
    // Якщо різних розкладів менше, ніж треба завдань, той самий беремо
    // двічі: вміст він щоразу набирає інший, а от форма повториться —
    // тому вище в таблиці майже всюди дано ДВА різні розклади.
    const use = [];
    while (use.length < k) use.push(...pick(makers, Math.min(k - use.length, makers.length)));
    for (let i = 0; i < k; i++){
      try { t[i] = use[i](v); } catch (e) { /* лишаємо звичайне завдання */ }
    }
    return shuffle(t);
  };
}

  if (mk) l.gen = mixDrag(l.gen, mk, 2);

// ===== ЗАГЛИБЛЕННЯ: нитка на кілька днів крізь кілька островів =====
//
// Навіщо. Острів дає пʼять не повʼязаних між собою завдань і зірку.
// Заглиблення дає ПРИЧИНУ їх робити: дитина не «проходить Острів Тварин»,
// а розгадує, хто ходив по снігу. На цьому збігаються всі шість систем,
// які ми дивилися (`РІЗНОМАНІТТЯ.md`): вальдорфська «епоха», тематичні
// блоки «Освіти. Діти. Майбутнє», домени Core Knowledge.
//
// Три речі, які тут зроблено свідомо:
//
// 1. **Крок починається з учорашнього.** Перші одне-два завдання кроку
//    беруться з островів ПОПЕРЕДНЬОГО кроку. Це вальдорфська пауза через
//    ніч: «узагальнення матеріалу та якісний крок у вивченні теми
//    відбувається наступного дня». Без цього заглиблення було б просто
//    списком уроків.
// 2. **Один крок на день.** Гра не дає пройти наступний крок того самого
//    дня — інакше нитка на тиждень збігає за двадцять хвилин і сенс
//    паузи зникає. Учитель може зняти обмеження в налаштуваннях профілю.
// 3. **Блок-карта наприкінці.** Назва з програми «Світ чекає крилатих»:
//    «путівник учня за вивченою темою». Кожен крок дає одну картку, і
//    наприкінці дитина має зібраний путівник, який можна показати.
//
// Нових островів НЕ додається: заглиблення бере завдання з наявних.

const BY_DEEP = Object.fromEntries(DEEP.map(d => [d.id, d]));

// ---------- Поступ дитини. Живе в тому самому профілі, що й зірки.
function deepState(did){
  const k = kid(); if (!k) return {step:0, cards:[], day:''};
  k.deep = k.deep || {};
  return (k.deep[did] = k.deep[did] || {step:0, cards:[], day:''});
}
// Чи можна починати наступний крок. Обмеження «один крок на день» — не
// каприз: без нього нитка на тиждень збігає за двадцять хвилин, і пауза,
// заради якої все й робилося, зникає.
function deepReady(did){
  const k = kid(), st = deepState(did);
  if (k && k.noWait) return true;                 // вчитель зняв обмеження
  return st.day !== today();
}
const deepDone = did => deepState(did).step >= BY_DEEP[did].steps.length;

// ---------- Запуск кроку
let DEEPID = null;
function startDeep(did){
  const d = BY_DEEP[did], st = deepState(did);
  const i = Math.min(st.step, d.steps.length - 1);
  const s = d.steps[i];
  DEEPID = did; DAILY = false;
  L = {id:'deep_' + did, name:d.name, vo:d.vo};
  lvl = 0; idx = 0; mistakes = 0; tasks = [];

  // Складність росте разом із кроком: перші кроки — легкий рівень.
  const v = i < 2 ? 1 : i < 4 ? 2 : 3;
  // Острови в кроці перемішуємо, інакше завдання йдуть парами з одного
  // острова підряд («чия це тінь» двічі), і крок виглядає як два уроки,
  // склеєні докупи. Однакові питання відсіюємо.
  const seen = new Set();
  const take = (ids, howMany) => {
    const pool = [];
    while (pool.length < howMany) pool.push(...shuffle(ids));
    for (let n = 0; n < howMany; n++){
      const l = BY_LES[pool[n]];
      if (!l) continue;
      try {
        const got = shuffle(l.gen(v));
        const t = got.find(x => !seen.has(String(x.prompt))) || got[0];
        seen.add(String(t.prompt));
        tasks.push(t);
      } catch (e) { /* острів не дав завдання — пропускаємо */ }
    }
  };
  // Спершу — одне-два завдання з учорашнього кроку.
  if (i > 0) take(d.steps[i - 1].from, 2);
  take(s.from, s.n);
  playTune(did in BY_DEEP ? (s.from[0] || 'theme') : 'theme');
  guide(['dst_' + did, d.story[1], 'swim'], true, null, 'swim');
  show();
}

// ---------- Кінець кроку: картка в путівник і наступний крок
function deepFinish(){
  const d = BY_DEEP[DEEPID], st = deepState(DEEPID), k = kid();
  const i = Math.min(st.step, d.steps.length - 1);
  const s = d.steps[i];
  if (!st.cards.includes(i)) st.cards.push(i);
  st.step = Math.min(i + 1, d.steps.length);
  st.day = today();
  save();
  return {step:s, i, last: st.step >= d.steps.length};
}

// ===== ЗНАЙДИ НА КАРТИНІ: одна сцена, багато натискань =====
//
// Навіщо. В усіх інших завданнях дитина вибирає ОДНУ відповідь і йде
// далі. Тут вона переглядає сцену й знаходить УСЕ, що підходить: усе
// кругле, усе живе, усе на «м». Жест ніби той самий — натиснути, — але
// робота інша: не впізнати один предмет, а обвести очима ціле поле й
// нічого не проґавити. Це «знайди на картині» з `РІЗНОМАНІТТЯ.md`.
//
// Чому це вигідно: одна сцена дає десятки різних завдань, бо умова
// щоразу інша. Малюнок живе довго.
//
// Про картинку сцени. Поки її немає, тло малюється кольором (CSS), а
// предмети лежать поверх. Коли ComfyUI намалює `sc_*`, вона стане на
// місце сама — як і всюди в грі, через онопомилку в <img>.

// Сітка з тремтінням. Рівний ряд предметів перетворив би пошук на
// читання по порядку, а купа без сітки дає накладання, і дитина не може
// влучити пальцем. Тому сітка є, але кожен предмет зсунуто випадково.
function scatter(n){
  const cols = n <= 6 ? 3 : n <= 9 ? 3 : 4;
  const rows = Math.ceil(n / cols);
  const out = [];
  for (let i = 0; i < n; i++){
    const c = i % cols, r = Math.floor(i / cols);
    out.push({
      x: Math.round((c + 0.5) / cols * 100 + (rnd(17) - 8)),
      y: Math.round((r + 0.5) / rows * 100 + (rnd(15) - 7)),
    });
  }
  return shuffle(out);
}

// Завдання: items — усе, що на сцені; ті, у кого hit, треба знайти.
function findTask(prompt, speak, scene, items){
  const pos = scatter(items.length);
  return {kind:'find', prompt, speak, scn:scene,
    items: items.map((it, i) => Object.assign({}, it, pos[i])),
    // options — щоб кнопка 🔊 вгорі прочитала умову й підписи
    options: items.filter(x => x.vo && x.tx)};
}

function showFind(t, host){
  const need = t.items.filter(x => x.hit).length;
  // Малюнок сцени кладемо окремим <img> під предметами, а не фоном у CSS:
  // так він може не завантажитись і тихо зникнути, лишивши колір. Фон у
  // CSS такого запасу не має — була б порожня пляма.
  host.innerHTML = `<div class="find scn-${t.scn}">
    <div class="field"><img class="bg" src="${asset('img/sc_' + t.scn + '.png')}" alt=""
        onerror="this.remove()">${t.items.map((it, i) =>
      `<button class="obj" data-i="${i}" data-hit="${it.hit ? 1 : 0}"
        style="left:${it.x}%;top:${it.y}%">${it.html}</button>`).join('')}</div>
    <p class="count"><b id="cnt">0</b> з ${need}</p></div>`;
  const msg = $('#msg');
  let got = 0, miss = 0;
  host.querySelectorAll('.obj').forEach(b => b.onclick = () => {
    if (b.classList.contains('got') || b.disabled) return;
    if (b.dataset.hit === '1'){
      b.classList.add('got'); got++;
      $('#cnt').textContent = got;
      sfxOk();
      const it = t.items[+b.dataset.i];
      if (it.vo) say([[it.vo, it.tx || '']]);
      if (got === need){ guide(CRAB.good, false); pass(host); }
      else { msg.className = 'msg good'; msg.textContent = 'Є!'; }
    } else {
      // Зайвий предмет не ховаємо: дитина має бачити, що він лишився на
      // місці, інакше сцена порожніє й шукати стає нічого.
      miss++; mistakes++;
      b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
      sfxNo(); guide(CRAB.oops, false);
      msg.className = 'msg bad';
      if (miss === 1){ msg.textContent = 'Це не підходить — шукай далі'; say([P.tryagain]); }
      else {
        const left = [...host.querySelectorAll('.obj[data-hit="1"]:not(.got)')];
        if (left.length) left[0].classList.add('hint');
        msg.textContent = 'Підказка: один із потрібних блимає';
        say([P.hint]);
        if (left.length) guide(CRAB.hint, false, left[0]);
      }
    }
  });
}

// ---------- Умови пошуку. Усі зібрані з таблиць, які вже є в грі.
const bigE = e => `<span class="big">${e}</span>`;
// Скільки предметів на сцені й скільки з них потрібні
const findSize = v => v === 1 ? [6, 3] : v === 2 ? [9, 4] : [12, 5];

// — усе живе
const fAlive = v => {
  const [n, k] = findSize(v);
  const yes = pick(NATURE.filter(x => x[1] === 'жива'), k);
  const no = pick(NATURE.filter(x => x[1] !== 'жива'), n - k);
  return findTask('Знайди все живе',
    [['f_alive', 'Знайди на картині все живе']], 'forest',
    shuffle(yes.map(x => ({html:bigE(x[0]), hit:true}))
      .concat(no.map(x => ({html:bigE(x[0]), hit:false})))));
};
// — усе, що починається на певну букву
const fLetter = v => {
  const [n, k] = findSize(v);
  const byL = {};
  for (const w of WORDS) (byL[w[3]] = byL[w[3]] || []).push(w);
  const good = Object.keys(byL).filter(L2 => byL[L2].length >= k);
  const L2 = good[rnd(good.length)];
  const yes = pick(byL[L2], k);
  const no = pick(WORDS.filter(w => w[3] !== L2), n - k);
  return findTask(`Знайди все, що починається на «${L2}»`,
    [['f_letter', 'Знайди на картині все, що починається на букву'], ['let_' + LET_ID[L2.toLowerCase()], LET_NAME[L2.toLowerCase()]]],
    'room',
    shuffle(yes.map(w => ({html: pic(w[0], w[1]), hit:true, vo:w[0], tx:w[2]}))
      .concat(no.map(w => ({html: pic(w[0], w[1]), hit:false, vo:w[0], tx:w[2]})))));
};
// — тварини однієї групи
const fAnimals = v => {
  const [n, k] = findSize(v);
  const g = AGROUP[rnd(AGROUP.length)];
  const pool = ANIM.filter(a => a[1] === g[0]);
  if (pool.length < 3) return fAlive(v);
  const yes = pick(pool, Math.min(k, pool.length));
  const no = pick(ANIM.filter(a => a[1] !== g[0]), n - yes.length);
  return findTask(`Знайди всіх, хто це: ${g[0]}`,
    [['f_group', 'Знайди на картині всіх, хто належить до групи'], [g[1], g[0]]],
    'forest',
    shuffle(yes.map(a => ({html:bigE(a[0]), hit:true}))
      .concat(no.map(a => ({html:bigE(a[0]), hit:false})))));
};
// — усе небезпечне
const fDanger = v => {
  const [n, k] = findSize(v);
  const yes = pick(DANGER.filter(d => d[2]), Math.min(k, 5));
  const no = pick(DANGER.filter(d => !d[2]), n - yes.length);
  return findTask('Знайди все небезпечне',
    [['f_danger', 'Знайди на картині все, що небезпечне']], 'room',
    shuffle(yes.map(d => ({html:bigE(d[0]), hit:true}))
      .concat(no.map(d => ({html:bigE(d[0]), hit:false})))));
};
// — усе з одного матеріалу
const fMat = v => {
  const [n, k] = findSize(v);
  const m = MAT[rnd(MAT.length)];
  const yes = m[4].map(e => ({html:bigE(e), hit:true}));
  const rest = MAT.filter(x => x[0] !== m[0]).flatMap(x => x[4]);
  const no = pick(rest, Math.max(2, n - yes.length)).map(e => ({html:bigE(e), hit:false}));
  return findTask(`Знайди все, що з такого матеріалу: ${m[1]}`,
    [['f_mat', 'Знайди на картині все, що зроблено з цього матеріалу'], [m[2], m[1]]],
    'room', shuffle(yes.concat(no)));
};
// — фігури однієї форми
const fFig = v => {
  const [n, k] = findSize(v);
  const f = FIG[rnd(FIG.length)];
  const yes = pick(FIGCOL, Math.min(k, FIGCOL.length))
    .map(c => ({html: pic(`f_${f[0]}_${c[0]}`, '🔷'), hit:true}));
  const others = FIG.filter(x => x[0] !== f[0]);
  const no = [];
  while (no.length < n - yes.length){
    const f2 = others[rnd(others.length)], c = FIGCOL[rnd(FIGCOL.length)];
    no.push({html: pic(`f_${f2[0]}_${c[0]}`, '🔶'), hit:false});
  }
  return findTask(`Знайди всі фігури: ${f[1]}`,
    [['f_fig', 'Знайди на картині всі такі фігури'], [f[2], f[1]]],
    'sea', shuffle(yes.concat(no)));
};
// — числа, більші за задане
const fNum = v => {
  const [n, k] = findSize(v);
  const hi = v === 1 ? 10 : v === 2 ? 20 : 100;
  const edge = v === 1 ? 3 + rnd(4) : v === 2 ? 8 + rnd(8) : 20 + rnd(50);
  const yes = [], no = [];
  while (yes.length < k) yes.push(edge + 1 + rnd(Math.max(1, hi - edge - 1)));
  while (no.length < n - k) no.push(1 + rnd(edge));
  return findTask(`Знайди всі числа, більші за ${edge}`,
    [['f_num', 'Знайди на картині всі числа, більші за це']], 'sea',
    shuffle(yes.map(x => ({html:`<span class="big">${x}</span>`, hit:true}))
      .concat(no.map(x => ({html:`<span class="big">${x}</span>`, hit:false})))));
};
// — слова з певною кількістю складів
const fSyl = v => {
  const [n, k] = findSize(v);
  const want = v === 1 ? 2 : 1 + rnd(3);
  const pool = SYLW.filter(w => w[1] === want);
  if (pool.length < 3) return fLetter(v);
  const yes = pick(pool, Math.min(k, pool.length));
  const no = pick(SYLW.filter(w => w[1] !== want), n - yes.length);
  const card = ([id]) => ({html: pic(id, BY_ID[id][1]), vo:id, tx:BY_ID[id][2]});
  return findTask(`Знайди слова, у яких ${want} частини`,
    [['f_syl', 'Знайди на картині слова, у яких стільки частин'], n(want)], 'room',
    shuffle(yes.map(w => Object.assign(card(w), {hit:true}))
      .concat(no.map(w => Object.assign(card(w), {hit:false})))));
};
// — усе з однієї тематичної групи
const fGroup = v => {
  const [n] = findSize(v);
  const g = GROUPS[rnd(GROUPS.length)];
  const yes = g[2].map(e => ({html:bigE(e), hit:true}));
  const rest = GROUPS.filter(x => x[0] !== g[0]).flatMap(x => x[2]);
  const no = pick(rest, Math.max(3, n - yes.length)).map(e => ({html:bigE(e), hit:false}));
  return findTask(`Знайди все, що це: ${g[0]}`,
    [['f_grp', 'Знайди на картині все, що належить до групи'], [g[1], g[0]]],
    'room', shuffle(yes.concat(no)));
};

// ---------- Куди це поставити.
// Домішуємо так само, як перетягування: по одному завданню з пʼяти, щоб
// у заході було три види роботи — вибір, перетягування і пошук.
const FIND_BY_ISLAND = {
  read:    [fLetter],
  sound:   [fSyl],
  alive:   [fAlive],
  animals: [fAnimals],
  safe:    [fDanger],
  stuff:   [fMat],
  fig:     [fFig],
  group:   [fGroup],
  math:    [fNum],
  num20:   [fNum],
  num100:  [fNum],
  compare: [fNum],
  world:   [fAlive],
  signs:   [fDanger],
};
function mixFind(base, makers){
  return function (v){
    const t = base(v);
    try { t[t.length - 1] = makers[rnd(makers.length)](v); } catch (e) {}
    return shuffle(t);
  };
}
for (const l of LESSONS){
  const mk = FIND_BY_ISLAND[l.id];
  if (mk) l.gen = mixFind(l.gen, mk);
}


// ===== РИТМ ПАЛЬЦЕМ, КРАПКИ ПО ЧИСЛАХ, СИМЕТРІЯ =====
//
// Три завдання з одного пункту `РІЗНОМАНІТТЯ.md`: кінестетичний канал,
// якого в грі майже не було. Усі три не потребують жодного файлу —
// звук береться з того самого WebAudio, що й «правильно / помилка»,
// а малюнки — SVG.

// ---------- 1. РИТМ: гра плеще, дитина повторює пальцем
//
// Чому не «вибери правильний запис», як було на Острові Ритму: вибір із
// трьох рядків нот перевіряє впізнавання, а не відчуття ритму. Тут
// дитина відтворює — і це єдине завдання в грі, де рука має влучити
// не в місце, а в ЧАС.
//
// Як оцінюється. Абсолютний темп не важить: шестирічка повторить
// повільніше чи швидше, і це не помилка. Важить МАЛЮНОК — де довго, а
// де коротко. Тому проміжки між дотиками переводяться у «довгий /
// короткий» відносно найкоротшого, і порівнюється вже рядок.
// ВАЖЛИВО: тривалість ОСТАННЬОЇ ноти дотиком не виміряти — між нею й
// нічим немає проміжку. Тому ритми мусять різнитися вже першими n−1
// тривалостями, інакше два різні записи дають однаковий малюнок і
// рівне постукування проходить обидва. Перевірено: «♩ ♩ ♩» і «♪♪ ♩»
// обидва давали «SS», і другий зараховувався за рівний ритм.
const TAPPAT = [
  ['♩ ♩ ♩',     [.34, .34, .34]],      // SS
  ['♩ ♪♪',      [.34, .16, .16]],      // LS
  ['♪♪ ♩ ♩',    [.16, .16, .34, .34]], // SSL
  ['♩ ♪♪ ♩',    [.34, .16, .16, .34]], // LSS
  ['♩ ♩ ♪♪',    [.34, .34, .16, .16]], // LLS
  ['♪♪ ♩ ♪♪',   [.16, .16, .34, .16, .16]], // SSLS
];
// Малюнок ритму рядком: S — коротко, L — довго. Беремо проміжки МІЖ
// ударами, тому їх на один менше, ніж ударів.
const shape = gaps => {
  const lo = Math.min(...gaps);
  return gaps.map(g => g > lo * 1.45 ? 'L' : 'S').join('');
};
function tapTask(v){
  const pool = v === 1 ? TAPPAT.slice(0, 3) : TAPPAT;
  const [label, durs] = pool[rnd(pool.length)];
  return {kind:'tap', prompt:'Послухай і повтори пальцем',
    speak:[['q_tap', 'Послухай плескання, а тоді повтори його пальцем']],
    label, durs};
}
function showTap(t, host){
  const n = t.durs.length;
  // Проміжки, які гра ЗАГАДУЄ: між ударами лежить тривалість попереднього.
  const want = shape(t.durs.slice(0, -1));
  host.innerHTML = `<div class="tapz">
    <button class="say big-say" type="button" id="hear">🔊 Послухати</button>
    <button class="drum" id="drum"><span>🥁</span><b id="tcnt">0 з ${n}</b></button>
    <p class="tip">Торкайся барабана стільки ж разів і так само: де довго, а де коротко.</p>
    </div>`;
  const msg = $('#msg');
  let taps = [], tries = 0;
  const play = () => {
    let t0 = 0;
    for (const d of t.durs){
      setTimeout(() => beep([[523, d]], .14), t0 * 1000);
      t0 += d + .12;
    }
  };
  $('#hear').onclick = play;
  setTimeout(play, 600);

  const drum = $('#drum');
  drum.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (taps.length >= n) return;
    taps.push(performance.now());
    drum.classList.remove('hit'); void drum.offsetWidth; drum.classList.add('hit');
    beep([[523, .09]], .12);
    $('#tcnt').textContent = taps.length + ' з ' + n;
    if (taps.length < n) return;
    const gaps = taps.slice(1).map((x, i) => x - taps[i]);
    const ok = shape(gaps) === want;
    if (ok){
      sfxOk(); guide(CRAB.good, false); pass(host);
    } else {
      tries++; mistakes++; sfxNo(); guide(CRAB.oops, false);
      taps = []; $('#tcnt').textContent = '0 з ' + n;
      msg.className = 'msg bad';
      if (tries === 1){
        msg.textContent = 'Майже! Послухай ще раз і спробуй';
        say([P.tryagain]); setTimeout(play, 700);
      } else {
        // З другого разу показуємо малюнок ритму очима — так само, як в
        // інших завданнях гра після двох спроб показує правильне.
        msg.innerHTML = 'Підказка: ось такий ритм — <b>' + t.label + '</b>';
        say([P.hint]); setTimeout(play, 700);
      }
    }
  });
}

// ---------- 2. КРАПКИ ПО ЧИСЛАХ
//
// Дитина натискає крапки за порядком чисел, і з них проявляється
// малюнок. Лічба тут не самоціль, а спосіб щось отримати — тому
// натиснути «3» після «2» хочеться.
// Жодна крапка не має збігатися з іншою: номери малюються в самій
// крапці, і два однакові місця ховають один номер під іншим. Перевірено
// на метелику й човнику — у них я спершу повторив початкову крапку, і
// номер 1 зник під номером 9.
const DOTS = {
  5:  [['будиночок', [[26,62],[26,86],[74,86],[74,62],[50,38]]],
       ['човник',    [[14,58],[86,58],[74,80],[26,80],[50,36]]]],
  7:  [['ялинка',    [[50,12],[72,42],[60,36],[82,72],[18,72],[40,36],[28,42]]],
       ['рибка',     [[18,52],[40,34],[64,32],[84,44],[84,62],[60,72],[36,66]]]],
  10: [['зірка',     [[50,12],[58,38],[86,38],[63,54],[72,82],[50,65],
                      [28,82],[37,54],[14,38],[42,38]]],
       ['метелик',   [[50,28],[32,12],[16,32],[30,48],[50,46],[70,48],
                      [84,32],[68,12],[50,70],[50,86]]]],
};
// Крапки мають стояти не ближче ніж на 11 одиниць одна від одної:
// номер малюється в самій крапці, і сусіди злипаються в кашу.
function dotsTask(v){
  const n = v === 1 ? 5 : v === 2 ? 7 : 10;
  const [name, pts] = DOTS[n][rnd(DOTS[n].length)];
  return {kind:'dots', prompt:`Зʼєднай крапки за порядком — від 1 до ${n}`,
    speak:[['q_dots', 'Натискай крапки за порядком чисел, і проявиться малюнок']],
    name, pts};
}
function showDots(t, host){
  const n = t.pts.length;
  host.innerHTML = `<div class="dotsz">
    <svg viewBox="0 0 100 100" class="board">
      <polyline class="line" points=""/>
      ${t.pts.map((p, i) =>
        `<g class="dot" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="6"/>
         <text x="${p[0]}" y="${p[1] + 2.6}">${i + 1}</text></g>`).join('')}
    </svg>
    <p class="count"><b id="dcnt">1</b> → ${n}</p></div>`;
  const msg = $('#msg');
  const line = host.querySelector('.line');
  let next = 0, tries = 0;
  host.querySelectorAll('.dot').forEach(g => g.addEventListener('pointerdown', e => {
    e.preventDefault();
    const i = +g.dataset.i;
    if (i < next) return;
    if (i !== next){
      tries++; mistakes++; sfxNo(); guide(CRAB.oops, false);
      g.classList.remove('no'); void g.offsetWidth; g.classList.add('no');
      msg.className = 'msg bad';
      if (tries === 1){ msg.textContent = 'Не ця — шукай наступне число'; say([P.tryagain]); }
      else {
        host.querySelector(`.dot[data-i="${next}"]`).classList.add('hint');
        msg.textContent = 'Підказка: потрібна крапка блимає'; say([P.hint]);
      }
      return;
    }
    g.classList.add('got');
    g.classList.remove('hint');
    line.setAttribute('points',
      t.pts.slice(0, i + 1).map(p => p.join(',')).join(' '));
    next++;
    sfxTap();
    $('#dcnt').textContent = Math.min(next + 1, n);
    if (next === n){
      // Останній штрих: замикаємо лінію і підписуємо, що вийшло —
      // заради цього дитина й рахувала.
      line.classList.add('done');
      msg.className = 'msg good';
      msg.textContent = 'Вийшов(ла) ' + t.name + '!';
      sfxOk(); guide(CRAB.good, false); pass(host, false);
    }
  }));
}

// ---------- 3. СИМЕТРІЯ: домалюй другу половину
//
// Ліва половина сітки зафарбована, дитина має повторити її дзеркально
// праворуч. Тема «симетрія в геометричних фігурах» є в програмі
// (додаткові теми математики), і показати її інакше, ніж дією, важко.
function mirrorTask(v){
  const H = 6, Wd = 3;                       // висота й половина ширини
  const k = v === 1 ? 5 : v === 2 ? 7 : 9;   // скільки клітинок зафарбовано
  const cells = new Set();
  while (cells.size < k) cells.add(rnd(H) * Wd + rnd(Wd));
  return {kind:'mirror', prompt:'Домалюй другу половину — щоб вийшло дзеркально',
    speak:[['q_mirror', 'Домалюй другу половину так, щоб половинки були однакові']],
    h:H, w:Wd, cells:[...cells]};
}
function showMirror(t, host){
  const H = t.h, Wd = t.w, full = Wd * 2;
  const left = new Set(t.cells);
  const need = t.cells.length;
  const cell = (r, c) => {
    const mirrored = c >= Wd;
    const lc = mirrored ? full - 1 - c : c;
    const on = left.has(r * Wd + lc);
    return `<button class="cl${!mirrored && on ? ' fill' : ''}${mirrored ? ' right' : ''}${c === Wd - 1 ? ' edge' : ''}"
      data-r="${r}" data-c="${c}" data-on="${on ? 1 : 0}"
      ${mirrored ? '' : 'disabled'}></button>`;
  };
  host.innerHTML = `<div class="mirz">
    <div class="grid" style="grid-template-columns:repeat(${full},1fr)">
      ${Array.from({length:H}, (_, r) =>
        Array.from({length:full}, (_, c) => cell(r, c)).join('')).join('')}
    </div>
    
    <p class="count"><b id="mcnt">0</b> з ${need}</p></div>`;
  const msg = $('#msg');
  let got = 0, tries = 0;
  host.querySelectorAll('.cl.right').forEach(b => b.onclick = () => {
    if (b.classList.contains('fill')) return;
    if (b.dataset.on === '1'){
      b.classList.add('fill'); got++; $('#mcnt').textContent = got;
      sfxTap();
      if (got === need){ sfxOk(); guide(CRAB.good, false); pass(host); }
      else { msg.className = 'msg good'; msg.textContent = 'Так!'; }
    } else {
      tries++; mistakes++; sfxNo(); guide(CRAB.oops, false);
      b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
      msg.className = 'msg bad';
      if (tries === 1){ msg.textContent = 'Тут порожньо — подивись на ліву половину'; say([P.tryagain]); }
      else {
        const left_ = [...host.querySelectorAll('.cl.right[data-on="1"]:not(.fill)')];
        if (left_.length) left_[0].classList.add('hint');
        msg.textContent = 'Підказка: потрібна клітинка блимає'; say([P.hint]);
      }
    }
  });
}

// ---------- Куди це поставити
const RHY_BY_ISLAND = {
  rhythm: [tapTask], tempo: [tapTask],
  math: [dotsTask], num20: [dotsTask], order: [dotsTask], write: [dotsTask],
  lines: [mirrorTask, dotsTask], fig: [mirrorTask], logic: [mirrorTask],
};
for (const l of LESSONS){
  const mk = RHY_BY_ISLAND[l.id];
  if (!mk) continue;
  const base = l.gen;
  l.gen = function (v){
    const t = base(v);
    try { t[t.length - 1] = mk[rnd(mk.length)](v); } catch (e) {}
    return shuffle(t);
  };
}


// ===== ЗБЕРИ, А НЕ ВИБЕРИ =====
//
// Чим це відрізняється від «постав у ряд» (`order`). Там усі картки
// потрібні, і дитина лише впорядковує. Тут у наборі є ЗАЙВІ частини:
// щоб скласти «МА-МА», треба і відкинути «ЛО» з «СУ», і поставити свої
// дві в правильному місці. Тобто вибір і порядок разом.
//
// Чому це важливо для першого класу: вибрати слово з трьох готових
// можна навмання, а скласти його зі складів — ні. Те саме з числом:
// «сорок сім» перестає бути картинкою й стає сорока й сімкою.
//
// Нагорода наприкінці — зібране читається вголос і показується цілим.
// Заради цього дитина й збирала.

// ---------- Загальна побудова
// parts — що має вийти, по порядку. extra — скільки зайвих підкинути.
function buildTask(prompt, speak, parts, pool, done){
  // У наборі мусить бути стільки «МА», скільки їх у слові, інакше друге
  // місце нічим заповнити.
  const tiles = parts.map((p, i) => ({id:'p' + i, html:p, need:i}))
    .concat(pool.map((p, i) => ({id:'x' + i, html:p, need:-1})));
  return {kind:'build', prompt, speak, parts, done,
    tiles: shuffle(tiles),
    options: []};
}
function showBuild(t, host){
  const n = t.parts.length;
  host.innerHTML = `<div class="build">
    <div class="strip">${t.parts.map((_, i) =>
      `<span class="cell" data-i="${i}"></span>`).join('')}</div>
    <div class="pool">${t.tiles.map(x =>
      `<button class="tile" data-id="${x.id}" data-need="${x.need}">${x.html}</button>`).join('')}</div>
    <p class="tip">Натискай частини по порядку. Зайві тут теж є.</p></div>`;
  const msg = $('#msg');
  let at = 0, tries = 0;
  host.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    if (+b.dataset.need === at){
      // Частина стає на місце й більше не повертається: виправляти
      // зібране першокласнику важче, ніж не помилитися.
      const cell = host.querySelector(`.cell[data-i="${at}"]`);
      cell.textContent = b.textContent;
      cell.classList.add('fill');
      b.disabled = true; b.classList.add('used');
      at++; sfxTap();
      if (at === n){
        msg.className = 'msg good';
        msg.innerHTML = 'Вийшло: <b>' + t.done + '</b>';
        sfxOk(); guide(CRAB.good, false);
        if (t.vo) say([[t.vo, t.done]]);
        pass(host, false);
      }
    } else {
      tries++; mistakes++; sfxNo(); guide(CRAB.oops, false);
      b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
      msg.className = 'msg bad';
      if (tries === 1){ msg.textContent = 'Не ця частина — спробуй іншу'; say([P.tryagain]); }
      else {
        const right = host.querySelector(`.tile[data-need="${at}"]:not(.used)`);
        if (right) right.classList.add('hint');
        msg.textContent = 'Підказка: потрібна частина блимає'; say([P.hint]);
        if (right) guide(CRAB.hint, false, right);
      }
    }
  });
}

// ---------- 1. Слово зі складів
function bWord(v){
  const pool = v === 1 ? WORDS_READ.filter(w => w[1].split('·').length === 2)
                       : WORDS_READ;
  const [w, split] = pool[rnd(pool.length)];
  const parts = split.split('·');
  // Зайві склади беремо з тих, яких у цьому слові немає.
  const extra = pick(SYLL.map(s => s.toUpperCase()).filter(s => !parts.includes(s)),
                     v === 1 ? 2 : 3);
  const t = buildTask(`Збери слово «${w}» зі складів`,
    [['q_build_w', 'Збери слово зі складів'], [wdId(w), w]],
    parts, extra, w);
  t.vo = wdId(w);
  return t;
}

// ---------- 2. Число з десятків і одиниць
function bNum(v){
  const N = v === 1 ? 11 + rnd(9) : v === 2 ? 21 + rnd(29) : 21 + rnd(79);
  const tens = Math.floor(N / 10) * 10, ones = N % 10;
  const parts = ones ? [String(tens), String(ones)] : [String(tens)];
  const extra = [];
  while (extra.length < (v === 1 ? 2 : 3)){
    const e = rnd(2) ? String(10 * (1 + rnd(9))) : String(1 + rnd(9));
    if (!parts.includes(e) && !extra.includes(e)) extra.push(e);
  }
  return buildTask(`Збери число ${N} з десятків і одиниць`,
    [['q_build_n', 'Збери число з десятків і одиниць']],
    parts, extra, String(N));
}

// ---------- 3. Речення зі слів
function bSent(v){
  const [s, k, mark, id] = SENTS[rnd(SENTS.length)];
  const words = s.slice(0, -1).split(' ');
  const parts = words.concat([mark]);
  // Зайве — слово з іншого речення і чужий розділовий знак.
  const other = SENTS.filter(x => x[0] !== s)[rnd(SENTS.length - 1)];
  const extra = [other[0].slice(0, -1).split(' ')[0].toLowerCase()]
    .concat(['.', '?', '!'].filter(x => x !== mark).slice(0, v === 1 ? 1 : 2));
  const t = buildTask('Збери речення зі слів і постав знак у кінці',
    [['q_build_s', 'Збери речення зі слів і постав знак у кінці'], [id, s]],
    parts, extra, s);
  t.vo = id;
  return t;
}

// ---------- Куди поставити
const BUILD_BY_ISLAND = {
  syll: [bWord], read: [bWord], sound: [bWord],
  num20: [bNum], num100: [bNum], math: [bNum],
  sent: [bSent], text: [bSent], quest: [bSent],
};
for (const l of LESSONS){
  const mk = BUILD_BY_ISLAND[l.id];
  if (!mk) continue;
  const base = l.gen;
  l.gen = function (v){
    const t = base(v);
    try { t[t.length - 1] = mk[rnd(mk.length)](v); } catch (e) {}
    return shuffle(t);
  };
}

// картинку й не чула нічого: say() шматок із порожнім id мовчки пропускає.
// Для шести-семирічного це втрачений сенс завдання — він бачить 🪑 і не

const N_ONES = ['', 'один', 'два', 'три', 'чотири', "п'ять", 'шість', 'сім',
                'вісім', "дев'ять"];
const N_TEENS = {11: 'одинадцять', 12: 'дванадцять', 13: 'тринадцять',
  14: 'чотирнадцять', 15: "п'ятнадцять", 16: 'шістнадцять', 17: 'сімнадцять',

  50: "п'ятдесят", 60: 'шістдесят', 70: 'сімдесят', 80: 'вісімдесят',
  90: "дев'яносто", 100: 'сто'};
function numWord(n){
  if (n === 0) return 'нуль';
  if (n === 110) return 'сто десять';
  if (N_TEENS[n]) return N_TEENS[n];
  if (N_TENS[n]) return N_TENS[n];
  if (n < 10) return N_ONES[n];
  const t = Math.floor(n / 10) * 10, o = n % 10;
  return o ? N_TENS[t] + ' ' + N_ONES[o] : N_TENS[t];
}

// --- текст усередині розмітки фішки. Без DOM не обійтися: html буває
// <span class="big">🪑</span>, <img …>, <svg…> або просто «МА».
const chipBox = document.createElement('div');
function chipText(html){
  chipBox.innerHTML = String(html);
  return (chipBox.textContent || '').trim();
}

// --- головне: що озвучити для цієї фішки. null — не озвучувати.
function chipVoice(html){
  const h = String(html);
  // 1. намальована картинка
  const m = h.match(/img\/([a-z0-9_]+)\.png/);
  if (m){
    const id = m[1];
    if (IMGV[id]) return IMGV[id];
    const f = id.match(/^f_([a-z]+)_/);
    if (f && FIGV[f[1]]) return FIGV[f[1]];
    if (BY_ID[id]) return [id, BY_ID[id][2]];        // картинка слова: w_kit
  }
  // 2. емодзі — або з data-e (підміна для картинки), або просто в тексті
  const de = h.match(/data-e="([^"]+)"/);
  const body = de ? de[1] : chipText(h);
  if (!body) return null;
  if (EMV[body]) return EMV[body];
  // 3. число
  if (/^\d{1,3}$/.test(body)){
    const n = +body;
    return n <= 110 ? ['n' + n, numWord(n)] : null;
  }
  // 4. склад (дві великі літери): МА -> sy_ma
  if (/^[А-ЯІЇЄҐ]{2}$/.test(body)) return ['sy_' + uaId(body), body];
  // 5. окрема літера — промовляємо НАЗВУ літери, як в абетці
  if (/^[а-яіїєґьА-ЯІЇЄҐЬ]$/.test(body)){
    const low = body.toLowerCase();
    if (LET_ID[low] === undefined) return null;
    return [body === low ? letVo(low) : letVoUp(low), body];
  }
  // 6. знак у кінці речення
  if (PUNCTV[body]) return PUNCTV[body];
  // 7. слово з речення (кому й велику літеру відкидаємо)
  const w = body.toLowerCase().replace(/[.,!?;:]+$/, '');
  if (WSV[w]) return WSV[w];
  return null;
}

// --- хук: добираємо голос фішкам, які його не мають
function voiceChips(tasks){
  for (const t of (tasks || [])){
    if (!t || typeof t !== 'object') continue;
    for (const key of ['items', 'tiles']){
      for (const it of (t[key] || [])){
        if (!it || it.vo) continue;
        const v = chipVoice(it.html);
        if (v){ it.vo = v[0]; it.tx = v[1]; }
      }
    }
    // Перетягування складає options із фішок ще до того, як вони отримали
    // голос, — перескладаємо, інакше кнопки «послухати» не з'явилися б.
    if (t.kind === 'drag')
      t.options = (t.items || []).concat(t.slots || []).filter(x => x.vo && x.tx);
  }
  return tasks;
}

for (const l of LESSONS){
  const base = l.gen;

// ===== ДОМАШНЄ ЗАВДАННЯ: писати букву в рядок =====
//
// Навіщо окремий режим, а не ще один острів. Острів дає пʼять РІЗНИХ
// завдань і зірку — це урок. Домашнє завдання з каліграфії влаштоване
// навпаки: одна буква, багато повторень, рядок за рядком. Саме так це
// виглядає в зошиті, і саме цього в грі не було: на острові Прописів
// дитина обводила букву ОДИН раз і йшла далі, а рука ставиться
// повторенням.
//
// Що тут свідомо зроблено інакше, ніж у прописах на острові:
//   * зразок стоїть ПЕРШИМ у рядку й лишається видимим до кінця — дитина
//     весь час має на що дивитися, як у зошиті;
//   * написане НЕ стирається після перевірки: рядок наповнюється, і видно
//     поступ — це головна нагорода тут;
//   * спроб не рахуємо й нічим не карaємо. Домашнє — це тренування, а не
//     оцінювання; острів для оцінки вже є;
//   * перевірка не на кнопку, а сама, через 900 мс після того, як палець
//     піднявся. Кнопку «Готово» шестирічка на кожну букву тиснути не
//     буде, а миттєва перевірка ламала б букви з двох штрихів (т, ж):
//     дитина підняла палець, щоб почати другий, — а їй уже «не вийшло».

const HW_ROWS = 3;          // рядків у завданні
const HW_CELLS = 4;         // скільки разів написати в рядку, крім зразка
const HW_S = 220;           // внутрішній розмір клітинки

// Букви беремо ті, які вже вчили: чверть визначає межу. Велика літера —
// з третьої чверті, бо до того її в прописах не дають.
function hwPick(){
  const t = term();
  const upto = t === 0 ? 7 : Math.min(7, 1 + t * 2);
  const low = (t === 0 ? ALL_LOW : LET_GROUPS.slice(0, upto).flat()).filter(c => PEN[c]);
  const up = (t === 0 || t >= 3) ? ALL_UP.filter(c => PEN[c]) : [];
  const pool = low.concat(up);
  return pick(pool, Math.min(HW_ROWS, pool.length));
}

let HWSET = [], HWI = 0;

// Лінійки в косу — ті самі, що на острові Прописів, щоб зошит був один
// і той самий. Числа не виношу в змінні: це малюнок, не налаштування.
function hwRules(){
  return [18, 35, 72, 90].map(y =>
      `<line class="rl" x1="2" y1="${y}" x2="98" y2="${y}"/>`).join('')
    + [10, 26, 42, 58, 74, 90].map(x =>
      `<line class="sl" x1="${x}" y1="90" x2="${x + 10}" y2="18"/>`).join('');
}

function hwGlyphSvg(glyph, model){
  const strokes = PEN[glyph] || [];
  const lay = cls => strokes.map(d => `<path class="${cls}" d="${d}"/>`).join('');
  // Зразок: доріжка, пунктир і сама буква. Клітинка для письма — лише
  // доріжка з пунктиром, букви в ній немає, бо її й треба написати.
  return `<svg class="glyph" viewBox="${PEN_VB.join(' ')}" aria-hidden="true">
    ${hwRules()}
    <g class="let" style="--road:12">
      ${lay('road')}${lay('dash')}${model ? lay('pen') : ''}
    </g></svg>`;
}

function startHw(){

  HWI = 0;
  if (!HWSET.length) return home();
  hwRow();
}

function hwRow(){

        ${Array.from({length: HW_CELLS}, (_, i) =>
          `<div class="cell" data-i="${i}">${hwGlyphSvg(ch, false)}
            <canvas class="ink"></canvas></div>`).join('')}
      </div>

    </div></div>

    done--; c.classList.remove('ok'); c._hwReset();

// Одна клітинка: обведення пальцем і самоперевірка. Міряємо тим самим
// способом, що й прописи на острові, — двома масками поза екраном.
function hwCell(cell, glyph, onOk){
  const S = HW_S, strokes = PEN[glyph] || [];
  const ic = cell.querySelector('canvas.ink');
  ic.width = ic.height = S;
  const k = ic.getContext('2d');
  k.lineWidth = 18; k.lineCap = 'round'; k.lineJoin = 'round'; k.strokeStyle = '#e8684a';

  const mask = document.createElement('canvas'); mask.width = mask.height = S;
  const m = mask.getContext('2d');
  m.setTransform(...penMatrix(S));
  m.lineCap = 'round'; m.lineJoin = 'round'; m.strokeStyle = '#000';
  const paint = w => { m.lineWidth = w; for (const d of strokes) m.stroke(new Path2D(d)); };
  paint(5);
  const strict = m.getImageData(0, 0, S, S).data;
  paint(20);                              // доріжка плюс товщина пальця
  const wide = m.getImageData(0, 0, S, S).data;

  let drawing = false, last = null, painted = false, locked = false, wait = null;
  const pt = e => { const r = ic.getBoundingClientRect();
    return [(e.clientX - r.left) * S / r.width, (e.clientY - r.top) * S / r.height]; };
  const clear = () => { k.clearRect(0, 0, S, S); painted = false; };
  cell._hwReset = () => { locked = false; clear(); };

  ic.addEventListener('pointerdown', e => {
    if (locked) return;
    try { ic.setPointerCapture(e.pointerId); } catch(err){}
    if (wait){ clearTimeout(wait); wait = null; }
    drawing = true; last = pt(e); painted = true;
    k.beginPath(); k.moveTo(last[0], last[1]); k.lineTo(last[0] + 0.1, last[1]); k.stroke();
  });
  ic.addEventListener('pointermove', e => {
    if (!drawing || locked) return;
    const p = pt(e);
    k.beginPath(); k.moveTo(last[0], last[1]); k.lineTo(p[0], p[1]); k.stroke(); last = p;
  });
  const stop = () => {
    if (!drawing) return;
    drawing = false;
    // Пауза перед перевіркою: буква може бути з двох штрихів.
    if (wait) clearTimeout(wait);
    wait = setTimeout(check, 900);
  };
  ic.addEventListener('pointerup', stop);
  ic.addEventListener('pointercancel', stop);

  function check(){
    wait = null;
    if (locked || !painted) return;
    const ink = k.getImageData(0, 0, S, S).data;
    let hit = 0, need = 0, stray = 0, all = 0;
    for (let i = 3; i < ink.length; i += 4){
      const on = ink[i] > 40;
      if (strict[i] > 40){ need++; if (on) hit++; }
      if (on){ all++; if (wide[i] <= 40) stray++; }
    }
    const cover = need ? hit / need : 0, out = all ? stray / all : 1;
    const msg = $('#msg');
    // М'якше, ніж на острові: домашнє — тренування руки, а не залік.
    if (cover >= .5 && out <= .45){
      locked = true;
      cell.classList.add('ok');
      sfxOk();
      msg.className = 'msg good'; msg.textContent = 'Гарно!';
      onOk();
    } else {
      cell.classList.add('no');
      setTimeout(() => cell.classList.remove('no'), 420);
      sfxNo();
      msg.className = 'msg bad';
      msg.textContent = cover < .5 ? 'Веди по пунктиру — від крапки'
                                   : 'Старайся не виходити за доріжку';
      clear();
    }
  }
}

// Наліпки — ті самі картинки, що й у завданнях: домальовувати нічого не

// ---------- Screens
function kidStars(k){

}

function totalStars(){
  return LESSONS.reduce((a, l) => a + lessonStars(l.id), 0);
}
// Прапорець росте разом із тим, як острів проходять: за три зірки —
// звичайний, за два бездоганні рівні — подвійний червоний вимпел, за всі
// три бездоганні — трофей. Різницю видно здалеку, не вчитуючись у зірки.
const perfect = id => LEVELS.filter(L => starsAt(id, L.n) === 3).length;
const PENNANT = '<svg class="pen" viewBox="0 0 22 24" aria-hidden="true">'
  + '<path d="M4 2v20" stroke="#6b4423" stroke-width="2.6" stroke-linecap="round" fill="none"/>'
  + '<path d="M5 3l13 3.5-13 3.5z" fill="#e0332a" stroke="#8c1d16" stroke-width="1"/>'
  + '<path d="M5 11l13 3.5-13 3.5z" fill="#e0332a" stroke="#8c1d16" stroke-width="1"/></svg>';
const mark = id => {
  const p = perfect(id);
  return p >= 3 ? '🏆' : p >= 2 ? PENNANT : lessonStars(id) >= 3 ? '🚩' : '';
};
// Острів, на якому краб щойно поставив прапорець: його прапорець прилітає
// згори, а не просто з'являється між двома екранами.
let NEWFLAG = null;
function islandCard(l, fresh){
  const s = lessonStars(l.id), m = mark(l.id);
  return `<button class="island" data-id="${l.id}">
    <span class="ico">${pic(l.img, l.ico)}${m ? `<b class="flag${fresh ? ' new' : ''}">${m}</b>` : ''}</span>
    <h2>${l.name}</h2><p>${l.about}</p>
    <span class="got${s>6?' nine':''}">${'★'.repeat(s)}<i>${'★'.repeat(9-s)}</i></span></button>`;
}

      <button class="island" id="hw">

      <button class="island" id="alb"><span class="ico">🏅</span><h2>Мої наліпки</h2>

    ${deepBlock()}
    ${SEAS.map(s => {
      // Острови з наступних чвертей не ховаються назавжди: їх видно, щойно

      // першокласник оком не охопить, та й завдання ще не вчили.
      const ls = s.ls.filter(id => inTerm(BY_LES[id]));

      const got = ls.reduce((a,id)=>a+lessonStars(id), 0), max = ls.length*9;

// Альбом наліпок: зібрані кольорові, решта — сірі силуети. Саме за цим

// Вибір рівня. Закритий рівень лишається видимим, але підписано, що
// відкриє його — дитина бачить, куди рухатись.

let L, lvl, tasks, idx, mistakes, tries, DAILY = false;
function start(id, v){
  DAILY = false; DEEPID = null;
  L = BY_LES[id]; lvl = v || 1;
  tasks = L.gen(lvl); idx = 0; mistakes = 0;
  playTune(id);
  show();
  // Після show(), а не до нього: краб показує клешнею на саме завдання,
  // а воно з'являється на екрані щойно тут. На Острові Звуків він плеще
  // склади разом із дитиною, у Морі Мови — читає з книжкою.
  const lang = SEAS.find(s => s.id === 'slang').ls.includes(id);
  guide(CRAB.go, false, '.stage, .cards, .trace',
        id === 'sound' ? 'clap' : lang ? 'read' : 'point');
}
// Щоденна мандрівка: по одному завданню з п'яти різних островів, три
// хвилини — і наліпка. Привід зайти в гру щодня, навіть коли всі зірки є.
function startDaily(){
  DAILY = true; DEEPID = null;
  L = {id:'daily', name:'Щоденна мандрівка', vo:'p_daily'};
  lvl = 0; idx = 0; mistakes = 0; tasks = [];
  for (const l of pick(LESSONS.filter(x => x.id !== 'memo' && inTerm(x)), 5)){
    const got = l.gen(1 + rnd(2));
    tasks.push(got[rnd(got.length)]);
  }
  guide(CRAB.daily, true, null, 'swim');   // мандрівка — краб пливе
  show();
}

function show(){
  const t = tasks[idx]; tries = 0;
  scene("lesson");
  $('#app').innerHTML = `<section class="lesson">
    <div class="bar"><button class="back" id="back">← Карта</button>
      <div class="progress">${tasks.map((_,i)=>`<span class="${i<idx?'done':i===idx?'now':''}"></span>`).join('')}</div></div>
    <div class="q"><h3>${t.prompt}</h3><button class="say" id="say" aria-label="Послухати ще раз">🔊</button></div>
    <div id="body"></div>
    <p class="msg" id="msg" aria-live="polite"></p></section>`;
  $('#back').onclick = home;
  // Варіанти словами читаються вслід за питанням: дитина 1 класу їх не прочитає.
  const full = () => t.speak.concat(
    (t.options || []).filter(o => o.vo && o.tx).map(o => [o.vo, o.tx]));
  $('#say').onclick = () => say(full());
  ({memo: showMemo, trace: showTrace, drag: showDrag, find: showFind,
    tap: showTap, dots: showDots, mirror: showMirror, build: showBuild}[t.kind]
    || showChoice)(t, $('#body'));
  if (DAILY && idx === 0) setTimeout(() => say(full()), 2800);   // спершу краб
  else say(full());
}

// Shared ending of a task: praise, then the button to move on.
function pass(hostEl, praise){
  const msg = $('#msg');
  if (praise !== false){ const p = PRAISE[rnd(PRAISE.length)];
    msg.className='msg good'; msg.textContent=p[1]; say([p]); }
  const nx = document.createElement('button'); nx.className='next';
  nx.textContent = idx<tasks.length-1 ? 'Далі →' : 'Готово';
  nx.onclick = ()=>{ idx++; idx<tasks.length ? show() : finish(); };
  hostEl.closest('.lesson').appendChild(nx); nx.focus();
}

function showChoice(t, host){
  const cls = t.options.length === 2 ? ' two' : t.options.length > 3 ? ' many' : '';
  host.innerHTML = `${t.stage ? `<div class="stage">${t.stage}</div>` : ''}
    <div class="answers${cls}">${t.options.map(o=>{
      // Цифра чи буква має бути велика, а підпис на кілька слів — ні.
      const pic_ = o.html.includes('<img') || o.html.includes('<svg')
        || o.html.includes('class="big"');
      const long = !pic_ && [...o.html].length > 2;
      return `<button class="ans${long?' txt':''}" data-v="${o.v}">${o.html}`
        + (long && o.vo ? '<b class="sp">🔊</b>' : '') + '</button>';
    }).join('')}</div>`;
  host.querySelectorAll('.ans').forEach(b => b.onclick = e => {
    const o = t.options.find(x => String(x.v) === b.dataset.v);
    // Маленький 🔊 на кнопці читає саме цю відповідь і нічого не обирає.
    if (e.target.closest('.sp')){ if (o && o.vo) say([[o.vo, o.tx || '']]); return; }
    answer(b, t);
  });
}

function answer(btn,t){
  const msg = $('#msg');
  if (btn.dataset.v === t.answer){
    btn.classList.add('ok'); document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
    sfxOk(); guide(CRAB.good, false);
    pass(btn);
  } else {
    tries++; mistakes++; btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no'); btn.disabled = true;
    sfxNo(); guide(CRAB.oops, false);
    msg.className='msg bad';
    if (tries===1){ msg.textContent='Спробуй ще раз'; say([P.tryagain]); }
    else {
      const right = document.querySelector(`.ans[data-v="${CSS.escape(t.answer)}"]`);
      right.classList.add('hint');
      msg.textContent='Підказка: правильна відповідь обведена'; say([P.hint]);
      // Краб не просто каже «дивись» — він повертається і показує клешнею
      // саме на ту кнопку.
      guide(CRAB.hint, false, right);
    }
  }
}

// ---------- Memory: two taps open two cards; a pair stays open and is named
function showMemo(t, host){
  const deck = shuffle(t.pairs.concat(t.pairs));
  const cols = Math.ceil(deck.length/2);
  host.innerHTML = `<div class="cards" style="grid-template-columns:repeat(${cols},1fr)">${
    deck.map(w=>`<button class="card" data-id="${w[0]}"><span class="face">${pic(w[0],w[1])}</span></button>`).join('')}</div>`;
  let open = [], miss = 0, lock = false, left = t.pairs.length;
  host.querySelectorAll('.card').forEach(c => c.onclick = () => {
    if (lock || c.classList.contains('open') || c.classList.contains('done')) return;
    c.classList.add('open'); open.push(c);
    if (open.length < 2) return;
    const [a,b] = open;
    if (a.dataset.id === b.dataset.id){
      open = []; a.classList.add('done'); b.classList.add('done');
      const w = t.pairs.find(p => p[0] === a.dataset.id);
      sfxOk(); say([P.pair,[w[0],w[2]]]);
      // Wrong pairs are the game, not mistakes. Simulated play: even with
      // perfect recall a child turns up about three wrong pairs per round of
      // four, so the old "one free" rule handed out one star every single
      // time. Free allowance is pairs+1, and only beyond that does every
      // second wrong pair count as a mistake.
      if (--left === 0){
        mistakes += Math.max(0, Math.ceil((miss - (t.pairs.length + 1)) / 2));
        pass(host);
      }
    } else {
      lock = true; miss++; sfxNo();
      const msg = $('#msg'); msg.className='msg bad'; msg.textContent='Не збіглося — спробуй ще';
      setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open');
        open = []; lock = false; msg.textContent=''; }, 900);
    }
  });
}

// ---------- Tracing: finger draws on the top canvas, the letter sits under it.
// Scoring: how much of the letter is covered, and how much ink went outside it.
function showTrace(t, host){
  const S = 320;                                   // internal size; CSS scales it
  const strokes = PEN[t.glyph] || [];
  // Доріжка вужча на складному рівні: там уже треба вести точно.
  const road = t.hard ? 9 : 12;
  // Лінійки зошита в косу лінію. Малювати їх руками в розмітці не
  // випадало б: їх вісім, і всі залежать від однієї сітки.
  const rules = [18, 35, 72, 90].map(y =>
      `<line class="rl" x1="2" y1="${y}" x2="98" y2="${y}"/>`).join('')
    + [10, 26, 42, 58, 74, 90].map(x =>
      `<line class="sl" x1="${x}" y1="90" x2="${x + 10}" y2="18"/>`).join('');
  const lay = cls => strokes.map(d => `<path class="${cls}" d="${d}"/>`).join('');
  host.innerHTML = `<div class="trace">
    <div class="pad">
      <svg class="glyph" viewBox="${PEN_VB.join(' ')}" aria-hidden="true">
        ${rules}
        <g class="let" transform="${penT}" style="--road:${road}">
          ${lay('road')}${lay('dash')}${lay('pen')}
        </g>
      </svg>
      <canvas class="ink"></canvas></div>
    <div class="row"><button class="back" id="clear">Стерти</button>
      <button class="back" id="again">Покажи</button>
      <button class="next" id="check">Готово</button></div></div>`;
  const svg = host.querySelector('svg.glyph'), ic = host.querySelector('canvas.ink');
  ic.width = ic.height = S;
  const k = ic.getContext('2d');

  // Крапка-початок і номер штриха. Ставимо по готових шляхах, бо
  // getPointAtLength працює лише на вставленому в сторінку елементі.
  const pens = [...svg.querySelectorAll('.pen')];
  pens.forEach((p, i) => {
    const a = p.getPointAtLength(0);
    svg.querySelector('.let').insertAdjacentHTML('beforeend',
      `<circle class="dot" cx="${a.x}" cy="${a.y}" r="2.4"/>`
      + (pens.length > 1 ? `<text class="no" x="${a.x + 3.4}" y="${a.y - 3}">${i + 1}</text>` : ''));
  });

  // Показ: літера пишеться сама, штрих за штрихом. Саме цього бракувало
  // друкованому силуету — дитина має побачити, звідки вести й куди.
  let show = 0;                       // номер показу; обриває попередній
  const let_ = svg.querySelector('.let');
  function demo(){
    const my = ++show;
    let_.classList.remove('done');
    pens.forEach(p => { const L = p.getTotalLength();
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
    (function run(i){
      if (my !== show) return;
      if (i >= pens.length){ setTimeout(() => { if (my === show) let_.classList.add('done'); }, 500); return; }
      const p = pens[i], L = p.getTotalLength(), ms = Math.max(650, L * 13), t0 = performance.now();
      (function step(now){
        if (my !== show) return;
        const f = Math.min(1, (now - t0) / ms);
        p.style.strokeDashoffset = L * (1 - f);
        if (f < 1) requestAnimationFrame(step); else setTimeout(() => run(i + 1), 240);
      })(t0);
    })(0);
  }
  demo();

  // Дві маски поза екраном: вузька доріжка (нею міряємо, чи проведено
  // лінію) і широка (за неї виходити не можна). Обидві — ті самі шляхи
  // з тим самим нахилом, тож перевірка збігається з тим, що видно.
  const mask = document.createElement('canvas'); mask.width = mask.height = S;
  const m = mask.getContext('2d');
  m.setTransform(...penMatrix(S));
  m.lineCap = 'round'; m.lineJoin = 'round'; m.strokeStyle = '#000';
  const paint = w => { m.lineWidth = w;
    for (const d of strokes) m.stroke(new Path2D(d)); };
  paint(5);
  const strict = m.getImageData(0,0,S,S).data;
  paint(road + 8);                  // доріжка плюс товщина самого пальця
  const wide = m.getImageData(0,0,S,S).data;

  k.lineWidth = 26; k.lineCap='round'; k.lineJoin='round'; k.strokeStyle='#e8684a';
  let drawing = false, last = null, painted = false;
  const pt = e => { const r = ic.getBoundingClientRect();
    return [(e.clientX-r.left)*S/r.width, (e.clientY-r.top)*S/r.height]; };
  ic.addEventListener('pointerdown', e => {
    try { ic.setPointerCapture(e.pointerId); } catch(err){}
    show++;                            // дитина почала — показ обриваємо
    pens.forEach(p => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; });
    drawing = true; last = pt(e); painted = true;
    k.beginPath(); k.moveTo(last[0], last[1]); k.lineTo(last[0]+0.1, last[1]); k.stroke();
  });
  ic.addEventListener('pointermove', e => {
    if (!drawing) return; const p = pt(e);
    k.beginPath(); k.moveTo(last[0], last[1]); k.lineTo(p[0], p[1]); k.stroke(); last = p;
  });
  const stop = () => { drawing = false; };
  ic.addEventListener('pointerup', stop);
  ic.addEventListener('pointercancel', stop);

  const clear = () => { k.clearRect(0,0,S,S); painted = false; };
  host.querySelector('#clear').onclick = clear;
  host.querySelector('#again').onclick = () => { clear(); demo(); };
  host.querySelector('#check').onclick = () => {
    const msg = $('#msg');
    if (!painted){ msg.className='msg bad'; msg.textContent='Спершу обведи пальцем'; return; }
    const ink = k.getImageData(0,0,S,S).data;
    let hit = 0, need = 0, stray = 0, all = 0;
    for (let i=3; i<ink.length; i+=4){
      const on = ink[i] > 40;
      if (strict[i] > 40){ need++; if (on) hit++; }
      if (on){ all++; if (wide[i] <= 40) stray++; }
    }
    const cover = need ? hit/need : 0, out = all ? stray/all : 1;
    // Складний рівень вимагає точнішої лінії; друга спроба на будь-якому
    // рівні оцінюється м'якше — мета, щоб дитина провела лінію, а не здалась.
    const ok = t.hard
      ? (tries===0 ? (cover>=.65 && out<=.28) : (cover>=.5 && out<=.42))
      : (tries===0 ? (cover>=.55 && out<=.35) : (cover>=.4 && out<=.5));
    if (ok){
      host.querySelector('.row').remove();
      msg.className='msg good'; msg.textContent='Гарно написано!';
      sfxOk(); say([P.traceOk]); guide(CRAB.good, false);
      pass(host, false);
    } else {
      tries++; mistakes++; msg.className='msg bad'; sfxNo();
      if (tries===1){ msg.textContent='Майже! Спробуй ще раз'; say([P.traceTry]); }
      else {
        // Друга помилка — не просто темніша лінія, а ще один показ:
        // найчастіше дитина веде не туди, бо не бачила, звідки починати.
        host.querySelector('.pad').classList.add('bold');
        msg.textContent='Дивись, звідки вести'; say([P.hint]);
        setTimeout(demo, 300);
      }
      clear();
    }
  };
}

// Наліпка: спершу та, якої ще немає — колекція має наповнюватись, а не
// видавати те саме вдесяте. Коли всі зібрані, йде друга копія.
function award(k){
  k.st = k.st || {};
  const missing = STICKERS.filter(([id]) => !k.st[id]);
  const from = missing.length ? missing : STICKERS;
  const s = from[rnd(from.length)];
  k.st[s[0]] = (k.st[s[0]] || 0) + 1;
  return [s, missing.length > 0];
}

function finish(){
  const s = mistakes===0?3: mistakes<=2?2:1;
  scene("finish");
  const k = kid();
  const dres = DEEPID ? deepFinish() : null;
  if (DEEPID || DAILY){ if (DAILY){ k.day = today(); k.trips = (k.trips || 0) + 1; } }
  else {
    const was = mark(L.id);
    const at = k.stars[L.id] || (k.stars[L.id] = {});
    at[lvl] = Math.max(at[lvl] || 0, s);
    // Прапорець чи трофей щойно з'явився — краб поставить його на карті.
    if (mark(L.id) !== was) NEWFLAG = L.id;
  }
  // Журнал — для звіту вчителю: що саме проходили і як вийшло.
  k.log.push({l:L.id, v:lvl, s, m:mistakes, n:tasks.length, t:Date.now()});
  if (k.log.length > 300) k.log = k.log.slice(-300);
  // Наліпка — за три зірки й за кожну щоденну мандрівку.
  const gift = (s === 3 || DAILY || DEEPID) ? award(k) : null;
  save();
  report({kid:k.name, ava:k.ava, lesson:L.id, lvl, stars:s, mistakes, n:tasks.length, t:Date.now()});
  $('#total').textContent = totalStars();
  const lname = dres ? `${L.name}: ${dres.step.name}`
    : DAILY ? 'Щоденна мандрівка' : `${L.name}, ${LEVELS[lvl-1].name}`;
  $('#app').innerHTML = `<section class="lesson finish">
    <div class="big">${'★'.repeat(s)}</div><h3>${FIN[s][1]}</h3>
    <p class="lead">${lname}: ${tasks.length} із ${tasks.length} завдань. Помилок: ${mistakes}.</p>
    ${gift ? `<div class="gift">${pic(gift[0][0], gift[0][1])}
      <span>${gift[1] ? 'Нова наліпка в альбомі!' : 'Ще одна така наліпка!'}</span></div>` : ''}
    <div class="row">
      ${dres ? '<button class="next" id="deepbk">'
          + (dres.last ? 'Путівник зібрано!' : 'До нитки') + '</button>'
        : DAILY ? '' : '<button class="next" id="again">Ще раз</button>'
          + '<button class="back" id="lv">Інший рівень</button>'}
      <button class="back" id="alb">Альбом</button>
      <button class="back" id="map">До карти</button></div></section>`;
  sfxWin();
  const chain = [FIN[s], P.get, STARS[s]];
  if (gift){ chain.push(P.gift); setTimeout(sfxGift, 1200); }
  say(chain);
  guide(s === 3 ? CRAB.fin3 : CRAB.fin, false, gift ? '.gift' : null,
        s === 3 ? 'star' : 'joy');
  if (dres){
    // Картка кроку лягає в путівник одразу, щоб дитина побачила,
    // що нитка посунулася, а не просто «ще один урок».
    const did = DEEPID; DEEPID = null;
    $('#deepbk').onclick = () => deepScreen(did);
  } else if (!DAILY){
    $('#again').onclick = () => start(L.id, lvl);
    $('#lv').onclick = () => levels(L.id);
  }
  $('#alb').onclick = album;
  $('#map').onclick = home;
}

$('#me').onclick = who;
flush();                       // те, що не дійшло минулого разу
kid() ? home() : who();
</script>
